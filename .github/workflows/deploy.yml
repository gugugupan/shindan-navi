name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GA_ID: G-Q4NENX804G
      TZ: Asia/Tokyo
      # Repository variable LIVE_HOST says who serves shindan-navi.app: "pages" (default, until the
      # cutover in README.md › Deploy) or "worker". Pages keeps receiving every push until then.
      LIVE_HOST: ${{ vars.LIVE_HOST || 'pages' }}
      HAS_D1_ID: ${{ secrets.D1_DATABASE_ID != '' }}
      # Feedback form (api/README.md › Feedback): "1" builds /feedback/ and its links (Worker build only) and adds the
      # send_email binding in remote-config.mjs. Set it only after Email Routing, Turnstile, the secrets and the
      # migration are in place. TURNSTILE_SITE_KEY is the widget's public site key.
      FEEDBACK_ENABLED: ${{ vars.FEEDBACK_ENABLED }}
      # 話題カレンダー (contracts/voices.md): "1" builds /voices/, its tool tab and the home いま話題 from /api/v1/voices*
      # (D1, written by api/scripts/import-voices.mjs). build.py ignores it on the Pages build, which has no Worker.
      VOICES_ENABLED: ${{ vars.VOICES_ENABLED }}
      # Event landing pages /events/<slug>/<pref>/ (docs/design/event-landing.md): "1" builds their shell and the robots.txt
      # sitemap line, and remote-config.mjs routes the pages to the Worker. Set it only after migration 0007 is applied
      # and an import has written landing_pages. build.py ignores it on the Pages build.
      LANDING_ENABLED: ${{ vars.LANDING_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet fonttools==4.66.1 brotli==1.2.0

      # The Pages site has no /api/, so its build leaves /events/ out.
      - name: Build for Pages
        if: env.LIVE_HOST != 'worker'
        run: BUILD_EVENTS=0 python -I scripts/build.py

      - name: Deploy to Cloudflare Pages
        if: env.LIVE_HOST != 'worker'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: pages deploy dist --project-name shindan-navi --branch main --commit-dirty=true

      - name: Build for the Worker
        if: env.LIVE_HOST == 'worker' || env.HAS_D1_ID == 'true'
        env:
          MAPS_BROWSER_KEY: ${{ vars.MAPS_BROWSER_KEY }}
          LOGIN_ENABLED: ${{ vars.LOGIN_ENABLED }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: python -I scripts/build.py

      - uses: actions/setup-node@v4
        if: env.LIVE_HOST == 'worker' || env.HAS_D1_ID == 'true'
        with:
          node-version: "22"

      # Checks the build on a version preview URL before the deploy below: fails on a broken build (/, /events/),
      # only warns on API or data problems so a D1 hiccup never blocks publishing. The first domain attach is
      # gated strictly by `scripts/deploy.sh worker --domain`.
      - name: Preflight on a version preview URL
        if: env.LIVE_HOST == 'worker'
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node api/scripts/remote-config.mjs
          node api/scripts/preview-check.mjs

      # Writes the git-ignored wrangler.remote.json with the real D1 id (fails when the secret is empty).
      # Only LIVE_HOST=worker adds the shindan-navi.app custom domain; before that a deploy reaches the
      # version preview URL only.
      - name: Worker config
        if: env.LIVE_HOST == 'worker' || env.HAS_D1_ID == 'true'
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node api/scripts/remote-config.mjs ${{ env.LIVE_HOST == 'worker' && '--domain' || '' }}

      # Code + dist/ only. D1 migrations and data imports stay manual (api/README.md).
      - name: Deploy Worker
        if: env.LIVE_HOST == 'worker' || env.HAS_D1_ID == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: deploy --config wrangler.remote.json

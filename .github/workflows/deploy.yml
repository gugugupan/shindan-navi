name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GA_ID: G-Q4NENX804G
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tools
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet fonttools==4.66.1 brotli==1.2.0

      - name: Build
        run: python -I scripts/build.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fills the real D1 id into the git-ignored wrangler.remote.json; fails when the secret is empty.
      - name: Worker config
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: node api/scripts/remote-config.mjs

      # Deploys code + dist/ only. D1 migrations and data imports stay manual (api/README.md).
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: deploy --config wrangler.remote.json

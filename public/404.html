<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ページが見つかりません｜新弾ナビ</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#eceef4;--ink:#161a2b;--muted:#646a80;--accent:#3a43d0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f111a;--ink:#e8eaf3;--muted:#9ca2b8;--accent:#8f98ff;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
img{width:96px;height:96px}
h1{font-size:20px;margin:12px 0 4px}
p{color:var(--muted);margin:0 0 16px}
a{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<main>
<img src="/apple-touch-icon.png" alt="" style="border-radius:22px">
<h1>ページが見つかりません</h1>
<p>URL が変わったか、削除された可能性があります。</p>
<a href="/">新弾ナビのトップへ</a>
</main>
</body>
</html>

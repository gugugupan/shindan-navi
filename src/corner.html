<!--
  Logo-row controls of every page, inserted by build.py at the CORNER slot (styles: "corner" in template.html).
  The product switch (TOOLS) sits right after the logo (a bottom tab bar on phones); the corner on the right holds
  settings (theme; logged in, it moves into the account 設定 dialog) and with LOGIN_ENABLED the user control. With FEEDBACK_ENABLED both menus link to /feedback/?from=<this path>.
  The user control calls /api/v1/me only while the __Host-sn_user cookie is set, so logged-out visitors make no
  /api calls. It publishes the user as window.snUser (undefined = not known yet, null = logged out) and a
  "sn:user" event on document whenever that changes. Logged in, it also syncs favourites, /events/ saved filters
  and the add-to-calendar setting with the account (window.snPrefs, "sn:prefs" event; see the sync block below).
-->
<!--TOOLTABS-->
<div class="corner">
  <div class="cmenu" id="setBox">
    <button class="cbtn" id="setBtn" aria-haspopup="true" aria-expanded="false" aria-controls="setPop" aria-label="設定" title="設定"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <div class="cpop" id="setPop" hidden>
      <p class="cpop-h" id="setThemeH">テーマ</p>
      <div class="seg themeseg" role="radiogroup" aria-labelledby="setThemeH"><button role="radio" data-theme-v="auto">自動</button><button role="radio" data-theme-v="light">ライト</button><button role="radio" data-theme-v="dark">ダーク</button></div>
<!--FEEDBACK-->      <hr class="cpop-sep"><a class="mi" href="/feedback/" data-feedback>ご意見・ご要望</a>
<!--/FEEDBACK-->    </div>
  </div>
<!--LOGIN-->
  <div class="cmenu" id="userBox">
    <a class="loginbtn" id="loginBtn" href="/api/v1/auth/google/start" rel="nofollow" aria-label="ログイン"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>ログイン</span></a>
    <button class="cbtn avatar" id="userBtn" hidden aria-haspopup="true" aria-expanded="false" aria-controls="userPop" aria-label="アカウント"></button>
    <div class="cpop" id="userPop" hidden>
      <p class="cpop-h cpop-user" id="userName"></p>
      <button class="mi" data-acct="settings">設定</button>
<!--FEEDBACK-->      <a class="mi" href="/feedback/" data-feedback>ご意見・ご要望</a>
<!--/FEEDBACK-->      <button class="mi" data-acct="logout">ログアウト</button>
    </div>
  </div>
  <dialog id="acctDlg" class="acctdlg" aria-labelledby="acctTitle"><div class="dlg">
    <button class="ib close" id="acctClose" aria-label="閉じる">×</button>
    <h2 class="dl-day" id="acctTitle">設定</h2>
    <section class="acct-sec"><h3 id="acctThemeH">テーマ</h3>
      <div class="seg themeseg" role="radiogroup" aria-labelledby="acctThemeH"><button role="radio" data-theme-v="auto">自動</button><button role="radio" data-theme-v="light">ライト</button><button role="radio" data-theme-v="dark">ダーク</button></div></section>
    <section class="acct-sec"><h3>アカウント</h3>
      <div class="acct-who" id="acctWho"></div>
      <p class="acct-note">お気に入りと絞り込み条件はアカウントに保存され、ログインしたほかの端末と同期します。</p>
      <div><button class="sbtn ghost" data-acct="logout">ログアウト</button></div></section>
    <section class="acct-sec acct-del" id="acctDel"><h3>アカウント削除</h3>
      <p class="acct-note">アカウントと、同期したお気に入り・設定をサーバーからすぐに完全に削除します。元に戻すことはできません。このブラウザに保存されているお気に入りは残ります。</p>
      <label class="cal-off"><input type="checkbox" id="acctDelOk"> 削除することを確認しました</label>
      <div><button class="sbtn warn" data-acct="delete-confirm" disabled>アカウントを削除</button></div></section>
    <p class="acct-msg" id="acctMsg" role="status"></p>
    <p class="acct-note"><a href="/privacy/">プライバシーポリシー</a></p>
  </div></dialog>
<!--/LOGIN-->
</div>
<script>
(function(){
  const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  const track=(name,params)=>{ try{ if(window.gtag) window.gtag('event',name,params||{}); }catch(e){} };
  const $=id=>document.getElementById(id);

  // ---- theme: 自動 follows the system (or the host's data-theme, e.g. OG renders)
  const root=document.documentElement, hostTheme=root.getAttribute('data-theme');
  const THEMES=['auto','light','dark'];
  let theme=ls.get('tcg.theme','auto'); if(!THEMES.includes(theme)) theme='auto';
  function applyTheme(){
    if(theme==='auto'){ hostTheme?root.setAttribute('data-theme',hostTheme):root.removeAttribute('data-theme'); }
    else root.setAttribute('data-theme',theme);
    document.querySelectorAll('[data-theme-v]').forEach(b=>b.setAttribute('aria-checked',b.dataset.themeV===theme));
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-theme-v]'); if(!b||b.dataset.themeV===theme) return;
    theme=b.dataset.themeV; ls.set('tcg.theme',theme); track('change_theme',{theme}); applyTheme();
  });
  applyTheme();

  // ---- feedback links carry the page they were opened from
  if(location.pathname!=='/feedback/') document.querySelectorAll('a[data-feedback]').forEach(a=>{ a.href=`/feedback/?from=${encodeURIComponent(location.pathname).replace(/%2F/g,'/')}`; });

  // ---- popover menus (one open at a time; outside click / Escape closes)
  const menus=[...document.querySelectorAll('.corner [aria-controls][aria-haspopup]')];
  function closeMenus(except){ menus.forEach(b=>{ if(b!==except){ b.setAttribute('aria-expanded','false'); $(b.getAttribute('aria-controls')).hidden=true; } }); }
  menus.forEach(b=>b.addEventListener('click',()=>{
    const open=b.getAttribute('aria-expanded')!=='true'; closeMenus(b);
    b.setAttribute('aria-expanded',open); $(b.getAttribute('aria-controls')).hidden=!open;
    if(open){ const f=$(b.getAttribute('aria-controls')).querySelector('[aria-checked="true"],button'); if(f) f.focus(); }
  }));
  document.addEventListener('click',e=>{ if(!e.target.closest('.cmenu')) closeMenus(); });
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape') return;
    const b=menus.find(x=>x.getAttribute('aria-expanded')==='true'); if(b){ closeMenus(); b.focus(); }
  });

  // ---- user (LOGIN_ENABLED builds only)
  const box=$('userBox'); if(!box) return;
  const API='/api/v1', loginBtn=$('loginBtn'), userBtn=$('userBtn'), dlg=$('acctDlg'), msg=$('acctMsg');
  const hasMark=()=>/(?:^|;\s*)__Host-sn_user=/.test(document.cookie);
  const clearMark=()=>{ document.cookie='__Host-sn_user=; Max-Age=0; Path=/; Secure; SameSite=Lax'; };
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const face=(u,cls)=>{
    const ini=esc(((u&&u.display_name)||'?').trim().slice(0,1).toUpperCase());
    return u&&u.avatar_url ? `<img class="${cls}" src="${esc(u.avatar_url)}" alt="" referrerpolicy="no-referrer" data-ini="${ini}">`
      : `<span class="${cls} ini">${ini}</span>`;
  };
  // a broken avatar URL falls back to the initial
  box.parentNode.addEventListener('error',e=>{
    const img=e.target; if(!(img instanceof HTMLImageElement)||!img.dataset.ini) return;
    const s=document.createElement('span'); s.className=img.className+' ini'; s.textContent=img.dataset.ini; img.replaceWith(s);
  },true);
  function show(u){
    loginBtn.hidden=!!u; userBtn.hidden=!u;
    $('setBox').hidden=u!==null; if(u!==null&&$('setBtn').getAttribute('aria-expanded')==='true') closeMenus();
    if(u===undefined){ userBtn.hidden=false; loginBtn.hidden=true; userBtn.innerHTML='<span class="av ini"></span>'; return; }
    if(!u){ closeMenus(); if(dlg.open) dlg.close(); return; }
    userBtn.innerHTML=face(u,'av'); userBtn.setAttribute('aria-label',`アカウント: ${u.display_name||''}`);
    $('userName').innerHTML=`${face(u,'av sm')}<span>${esc(u.display_name||'')}</span>`;
    $('acctWho').innerHTML=`${face(u,'av')}<span><b>${esc(u.display_name||'')}</b><small>Google アカウントでログイン中</small></span>`;
  }
  function setUser(u){
    window.snUser=u; show(u);
    if(u!==undefined) document.dispatchEvent(new CustomEvent('sn:user',{detail:{user:u}}));
    sync.user(u);
  }
  const send=(method,path,body,keepalive)=>fetch(API+path,{method,credentials:'same-origin',keepalive:!!keepalive,
    headers:{'content-type':'application/json',accept:'application/json'},body:body===undefined?undefined:JSON.stringify(body)});

  // ---- synced preferences. localStorage stays the source the pages read (and the whole story when logged out);
  // logged in it is a cache of the account. tcg.sync.base is the last server state this browser saw, so local
  // changes are diff(base → local) and survive failed writes, reloads and logged-out edits by the same user.
  // tcg.sync.user: the account that base belongs to; another account replaces local data instead of merging.
  // Pages call snPrefs.changed() after writing a synced key and re-read on the "sn:prefs" event.
  const sync=(()=>{
    const K={stars:'tcg.stars',filters:'tcg.ev.filters',askOff:'tcg.calAskOff',user:'tcg.sync.user',base:'tcg.sync.base'};
    const ID=/^i[0-9a-f]{10}$/, FKEYS=['game','pref','type','days','view'], MAX_STARS=2000;
    const del=k=>{ try{localStorage.removeItem(k)}catch(e){} };
    const normF=f=>{
      if(!f||typeof f!=='object') return null;
      const o={}; FKEYS.forEach(k=>{ if(typeof f[k]==='string'&&f[k]) o[k]=f[k]; });
      return Object.keys(o).length&&JSON.stringify(o).length<=1024 ? o : null;
    };
    const fEq=(a,b)=>JSON.stringify(normF(a))===JSON.stringify(normF(b));
    const rawStars=()=>{ const s=ls.get(K.stars,[]); return Array.isArray(s)?s.map(String):[]; };
    const local=()=>({stars:rawStars().filter(k=>ID.test(k)), filters:normF(ls.get(K.filters,null)), askOff:ls.get(K.askOff,false)===true});
    const fromServer=j=>{ const p=(j&&j.prefs)||{}; return {
      stars:(Array.isArray(p.stars)?p.stars:[]).filter(k=>ID.test(k)), filters:normF(p.event_filters),
      askOff:p.ask_calendar===false||p.ask_calendar==='off'}; };
    function diff(from,to){
      const a=new Set(from.stars), b=new Set(to.stars), d={};
      const add=to.stars.filter(k=>!a.has(k)), remove=from.stars.filter(k=>!b.has(k));
      if(add.length||remove.length) d.stars={add,remove};
      if(!fEq(from.filters,to.filters)) d.event_filters=to.filters;
      if(from.askOff!==to.askOff) d.ask_calendar=to.askOff?'off':'ask';
      return d;
    }
    // server state S plus the local changes made since `ref` (the state S already reflects)
    function adopt(S,ref,dropLegacy){
      const L=local(), d=diff(ref,L), st=new Set(S.stars);
      if(d.stars){ d.stars.remove.forEach(k=>st.delete(k)); d.stars.add.forEach(k=>st.add(k)); }
      const legacy=dropLegacy?[]:rawStars().filter(k=>!ID.test(k));
      ls.set(K.stars,[...st].slice(0,MAX_STARS).concat(legacy));
      const f='event_filters' in d ? L.filters : S.filters;
      f ? ls.set(K.filters,f) : del(K.filters);
      const off='ask_calendar' in d ? L.askOff : S.askOff;
      off ? ls.set(K.askOff,true) : del(K.askOff);
      ls.set(K.base,S);
      document.dispatchEvent(new CustomEvent('sn:prefs'));
      if(Object.keys(d).length) schedule(0);
    }
    let me=null, ready=false, busy=false, timer=0, lastWrite=0, lastRead=0, holdUntil=0;
    // false: stop syncing (logged out / login off here); keep local data
    function check(r){
      if(r.status===401||r.status===404){ clearMark(); setUser(null); return false; }
      if(r.status===429) holdUntil=Date.now()+60e3;
      return r.ok;
    }
    async function start(u){
      const id=String(u.id), prev=ls.get(K.user,null), base=ls.get(K.base,null);
      try{
        if(prev!==id || !base){
          const switched=prev!=null && prev!==id;
          const L0=local();
          const r=switched ? await fetch(API+'/me/prefs',{credentials:'same-origin',headers:{accept:'application/json'}})
            : await send('POST','/me/prefs/merge',{stars:L0.stars, ...(L0.filters?{event_filters:L0.filters}:{}), ...(L0.askOff?{ask_calendar:'off'}:{})});
          if(!check(r)||me!==u) return;
          const S=fromServer(await r.json());
          ls.set(K.user,id); ready=true; lastRead=Date.now();
          adopt(S, L0, switched);
        } else {
          ready=true; await refresh(true);
        }
      }catch(e){}
    }
    async function refresh(force){
      if(!ready||busy||(!force&&Date.now()-lastRead<30e3)) return;
      busy=true; const u=me;
      try{
        const r=await fetch(API+'/me/prefs',{credentials:'same-origin',headers:{accept:'application/json'}});
        if(!check(r)||me!==u) return;
        const j=await r.json(); lastRead=Date.now();
        adopt(fromServer(j), ls.get(K.base,null)||fromServer(j));
      }catch(e){} finally{ busy=false; }
    }
    function schedule(ms){
      if(!ready) return;
      clearTimeout(timer);
      // writes are limited to 5/min per user (AUTH_WRITE_LIMIT): at most one every 12 s
      timer=setTimeout(flush, Math.max(ms, lastWrite+12e3-Date.now(), holdUntil-Date.now(), 0));
    }
    async function flush(keepalive){
      clearTimeout(timer); timer=0;
      if(!ready) return;
      if(busy){ if(!keepalive) schedule(500); return; }
      const base=ls.get(K.base,null); if(!base) return;
      const L0=local(), d=diff(base,L0);
      if(!Object.keys(d).length) return;
      if(keepalive){ try{ send('PUT','/me/prefs',d,true); }catch(e){} return; }
      if(Date.now()<holdUntil){ schedule(0); return; }
      busy=true; lastWrite=Date.now(); const u=me; let S=null;
      try{
        const r=await send('PUT','/me/prefs',d);
        if(check(r)&&me===u) S=fromServer(await r.json());
        else if(r.status===429) schedule(0);
      }catch(e){} finally{ busy=false; }
      // a failed write leaves the change in diff(base → local): the next load or visit sends it again
      if(S) adopt(S,L0);
    }
    document.addEventListener('visibilitychange',()=>{
      if(document.visibilityState==='hidden'){ if(timer) flush(true); }
      else refresh(false);
    });
    window.addEventListener('pagehide',()=>{ if(timer) flush(true); });
    window.snPrefs={changed(){ schedule(1000); }};
    return {
      user(u){
        if(u===me) return;
        me=u; ready=false; clearTimeout(timer); timer=0;
        if(u) start(u);
      },
      flush,
      // the account is gone: the next login (a new account) merges this browser's data again
      forget(){ del(K.user); del(K.base); }
    };
  })();

  loginBtn.addEventListener('click',()=>{
    loginBtn.href=`${API}/auth/google/start?return=${encodeURIComponent(location.pathname+location.search)}`;
    track('login');
  });
  async function logout(){
    msg.textContent='';
    await sync.flush();
    try{
      const r=await send('POST','/auth/logout');
      if(!r.ok && r.status!==401) throw new Error(r.status);
      clearMark(); setUser(null); track('logout');
    }catch(e){ msg.textContent='ログアウトできませんでした。時間をおいてもう一度お試しください。'; if(!dlg.open) openDlg(); }
  }
  async function del(){
    msg.textContent='';
    try{
      const r=await send('DELETE','/me');
      if(r.status===429) throw new Error('busy');
      if(!r.ok && r.status!==401) throw new Error(r.status);
      sync.forget(); clearMark(); setUser(null); track('delete_account');
    }catch(e){ msg.textContent=e.message==='busy'?'混み合っています。1 分ほどおいてもう一度お試しください。':'アカウントを削除できませんでした。時間をおいてもう一度お試しください。'; }
  }
  function openDlg(){
    closeMenus(); $('acctDelOk').checked=false; dlg.querySelector('[data-acct="delete-confirm"]').disabled=true;
    if(!dlg.open){ if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open',''); }
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-acct]'); if(!b) return;
    const a=b.dataset.acct;
    if(a==='settings') openDlg();
    else if(a==='logout'){ closeMenus(); logout(); }
    else if(a==='delete-confirm' && $('acctDelOk').checked) del();
  });
  $('acctDelOk').addEventListener('change',e=>{ dlg.querySelector('[data-acct="delete-confirm"]').disabled=!e.target.checked; });
  $('acctClose').onclick=()=>dlg.close();
  dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
  dlg.addEventListener('close',()=>{ msg.textContent=''; });

  if(!hasMark()){ setUser(null); return; }
  setUser(undefined);
  fetch(API+'/me',{credentials:'same-origin',headers:{accept:'application/json'}}).then(async r=>{
    if(r.ok){ const j=await r.json(); setUser(j.user); return; }
    if(r.status===401){ clearMark(); setUser(null); return; }
    // 404: login is off on this host; 5xx: keep the session, try again on the next page
    if(r.status===404) clearMark();
    box.hidden=true; $('setBox').hidden=false; window.snUser=null;
  }).catch(()=>{ box.hidden=true; $('setBox').hidden=false; window.snUser=null; });
})();
</script>

<!--
  The today page (/). "Today" is Asia/Tokyo, computed in the browser: the site is rebuilt only on deploys, so build.py
  embeds the releases from build day -1 to +14 (HOME) and the page says so when it runs past that window.
  Events (EVENTS parts, BUILD_EVENTS on), only with a saved location: /events/days for this month and the first /events
  page from today, the cache keys /events/ uses too; one more page (the /events/ list's second page) only when a game
  column of today would otherwise stay short; /events/meta only once the location picker is opened (its counts).
  The location is the /events/ saved filter's (src/locpick.html), so changing it here changes it there.
-->
<title>今日発売のTCG・トレカ新弾とイベント｜トレカカレンダー</title>
<style>/*SITE_CSS*/</style>
<style>
.home{display:grid;gap:12px}
.hbar{margin:4px 0 0;font-size:inherit;font-weight:400;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.hbar b{font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,28px);line-height:1.2}
.hbar span{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted)}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blk.today{border-color:var(--foil);box-shadow:inset 0 0 0 1px var(--foil),var(--shadow)}
.blk-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0}
.blk-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.3}
.blk-h .tb{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--foil-ink);background:var(--foil);border-radius:4px;padding:2px 6px;vertical-align:3px;margin-left:6px}
.blk-h .sub{font-size:12.5px;font-weight:700;color:var(--muted);display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.blk-h .n{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap}
.blk-h .n b{font-family:var(--mono);color:var(--ink)}
.blk-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;margin-top:auto}
.go{font:inherit;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);white-space:nowrap;cursor:pointer}
.go:hover{border-color:var(--accent)}
.hint{margin:0;font-size:12px;color:var(--muted)}
.hint a{color:var(--accent)}
.none{margin:0;padding:18px 12px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted);font-size:13px;display:grid;gap:8px;justify-items:center}
.none b{color:var(--ink);font-size:14px}
.none.err{border-color:var(--sun);border-style:solid}
.rels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
a.pk{color:inherit;text-decoration:none;grid-template-columns:48px minmax(0,1fr);padding:6px 8px 6px 6px}
a.pk .th{width:48px}
a.pk .n{font-size:13px}
a.pk.on{border-color:var(--foil);box-shadow:inset 0 0 0 1px var(--foil)}
.pk .sm{color:var(--foil);margin-right:4px}
/* today's events: one column per game */
.gcols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px;align-items:start}
.gcol{border:1px solid var(--line);border-top:3px solid var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)));border-radius:10px;background:var(--surface-2);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gcol h3{margin:0 2px;display:flex;align-items:baseline;gap:8px;font-size:13.5px;line-height:1.35}
.gcol h3 .gn{display:inline-flex;align-items:center;gap:6px;min-width:0;color:var(--gt,hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 8%)))}
.gcol h3 i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)))}
.gcol h3 .c{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.gcol h3 .c b{font-family:var(--mono);color:var(--ink);font-size:13px}
.gcol .more{align-self:flex-start;font-size:12.5px;padding:3px 10px}
.gcol .q{margin:2px;font-size:12px;color:var(--muted)}
.evs{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;background:var(--surface);border-radius:8px;padding:7px 9px}
.ev .tm{grid-row:1/span 2;font-family:var(--mono);font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:3.2em}
.ev .tm.tbd{font-family:var(--body);font-size:11px;color:var(--muted)}
.ev a{font-size:13px;font-weight:700;line-height:1.4;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.ev a:hover{color:var(--accent);text-decoration:underline}
.ev p{margin:0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ev .tag{font-size:11px;color:var(--gt,hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 6%)));margin-right:6px}
.ev .st{font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:6px;background:var(--sun);color:#fff}
.ev.off a{text-decoration:line-through;color:var(--muted)}
.ev.done .tm{color:var(--muted)}
.ev.done .tm::after{content:"開始済み";display:block;font-family:var(--body);font-size:10px;font-weight:700}
.sk{height:52px;border-radius:10px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.sk{animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}}
/* tomorrow and the rest of the week */
.wk{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.wd{border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface-2)}
.wd h3{margin:0;display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:13px}
.wd h3 .dw{font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted)}
.wd h3 .dw.sat{color:var(--sat)} .wd h3 .dw.sun{color:var(--sun)}
.wd h3 .lb{font-family:var(--body);font-size:10px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
.wd ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.wd li{font-size:12px;line-height:1.35;min-width:0}
.wd li a{color:var(--ink);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.wd li a:hover{color:var(--accent)}
.wd li .gl{font-size:10.5px;font-weight:700;color:var(--gt,hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 8%)));margin-right:4px}
.wd li i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)));margin-right:4px;vertical-align:1px}
.wd li.st a::before{content:"★ ";color:var(--foil)}
.wd li.st a{font-weight:700}
.wd li.e a{display:block;white-space:nowrap;text-overflow:ellipsis;color:var(--muted)}
.wd li.e b{font-family:var(--mono);font-size:11px;color:var(--ink);margin-right:4px}
.wd .q{margin:0;font-size:11.5px;color:var(--faint)}
.wd .rl{align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--accent);text-decoration:none}
.wd .rl b{font-family:var(--mono)}
.wd .rl:hover{text-decoration:underline}
.gcs{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.gcs.gmore{align-items:center;margin-top:8px}
.gmore .lab{font-size:12px;color:var(--muted);margin-right:2px}
.gc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--ink);text-decoration:none;border:1px solid var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)));background:var(--gtint,hsl(var(--h) 70% var(--tint-l)));border-radius:999px;padding:1px 8px 1px 6px;white-space:nowrap;min-width:0}
.gc span{display:inline-flex;align-items:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gc i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)))}
.gc b{font-family:var(--mono)}
.gc:hover{box-shadow:0 0 0 1px var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)))}
.gc.any{border-color:var(--line);background:var(--surface);color:var(--accent)}
/* a day without releases: the events take the space (one row per game) */
.wd.norel .gcs{flex-direction:column;align-items:stretch;margin-top:0}
.wd.norel .gc{justify-content:space-between;font-size:12px;padding:3px 10px 3px 8px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:1100px){
  .wk{grid-template-columns:repeat(3,minmax(0,1fr))}
  .gcols{grid-template-columns:repeat(min(var(--n),2),minmax(0,1fr))}
}
@media (max-width:760px){
  .blk{padding:12px;border-radius:12px}
  .rels{grid-template-columns:minmax(0,1fr)}
  .gcols{grid-template-columns:minmax(0,1fr)}
  .wk{grid-template-columns:minmax(0,1fr)}
  .wd{display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 10px;align-items:start}
  .wd h3{grid-row:1/span 4;flex-direction:column;align-items:center;gap:2px;font-size:16px}
  .wd .gcs{margin-top:2px}
  .wd.norel .gcs{flex-direction:row;align-items:center}
  .wd.norel .gc{border-radius:999px;font-size:11.5px;padding:1px 8px 1px 6px;gap:6px}
}
</style>

<script>
(function(){
const H = /*HOME*/null;
const API_BASE = /*API_BASE*/'/api/v1';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const track = (name, params) => { try { if (window.gtag) window.gtag('event', name, params || {}); } catch (e) {} };
const DOW = ['日','月','火','水','木','金','土'];
const TODAY = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addD = (s,n) => { const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const dowOf = s => new Date(s+'T00:00:00Z').getUTCDay();
const md = s => { const [,m,d]=s.split('-').map(Number); return `${m}/${d}(${DOW[dowOf(s)]})`; };
const addM = (ym,n) => { let [y,m]=ym.split('-').map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return y+'-'+String(m).padStart(2,'0'); };
const WEEK = Array.from({length:6},(_,i)=>addD(TODAY,i+1));
// releases are known for H.from..H.until only (build day -1 .. +14)
const covered = d => d>=H.from && d<=H.until;
// short title labels for the week list (other titles show their full name)
const SHORT = {'ポケモンカード':'ポケカ','ONE PIECE':'ワンピ','遊戯王OCG':'遊戯王','遊戯王ラッシュデュエル':'ラッシュデュエル','デュエル・マスターズ':'デュエマ',
  'ヴァイスシュヴァルツ':'ヴァイス','UNION ARENA':'ユニアリ','DBフュージョンワールド':'フュージョンワールド','デジモン':'デジカ','バトルスピリッツ':'バトスピ',
  'ヴァンガード':'ヴァンガ','Shadowverse EVOLVE':'シャドバ','ラブライブ！OCG':'ラブライブ','名探偵コナン':'コナン'};

// same colours as the release calendar (src/template.html: titles by count, golden-angle hues)
const games = Object.keys(H.counts).sort((a,b)=>H.counts[b]-H.counts[a]||a.localeCompare(b,'ja'));
const HUE = {}; games.forEach((g,i)=>HUE[g]=Math.round((i*137.508+230)%360));
const PLACEHOLDER = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M4 8L9.6 3 15.2 8 20.8 3 26.4 8 32 3 37.6 8 43.2 3 48.8 8 54.4 3 60 8V56L54.4 61 48.8 56 43.2 61 37.6 56 32 61 26.4 56 20.8 61 15.2 56 9.6 61 4 56Z" fill="currentColor" opacity=".22"/><path d="M32 11L38.4 25.6 53 32 38.4 38.4 32 53 25.6 38.4 11 32 25.6 25.6z" fill="currentColor"/></svg>';
const thumb = d => d.thumb ? `<img class="th" src="${esc(d.thumb)}" alt="" loading="lazy">` : `<span class="th none" aria-hidden="true">${PLACEHOLDER}</span>`;

let stars = new Set();
function readStars(){
  // legacy "date|name" keys are migrated by the release calendar; map them here too
  stars = new Set(store.get('tcg.stars',[]).map(k=>{
    k=String(k); if(!k.includes('|')) return k;
    const d=H.items.find(x=>x.date+'|'+x.name===k); return d?d.id:k;
  }));
}
const isStar = d => stars.has(d.id);
const byStar = (a,b) => isStar(b)-isStar(a);
const relsOn = d => H.items.filter(x=>x.date===d).sort(byStar);
const user = () => window.snUser;

function renderRel(){
  const its = relsOn(TODAY);
  $('hDate').textContent = (([y,m,d])=>`${+m}月${+d}日(${DOW[dowOf(TODAY)]})`)(TODAY.split('-'));
  const body=$('relBody');
  $('relN').innerHTML = covered(TODAY) && its.length ? `<b>${its.length}</b> 件` : '';
  $('relGo').href = its.length ? `/releases/#d=${TODAY}` : '/releases/';
  if(!covered(TODAY)){
    body.innerHTML = `<p class="none"><b>このページの発売情報は ${md(H.until)} までです</b><span>最新の発売予定は新弾カレンダーでご確認ください。</span></p>`;
  } else if(!its.length){
    const next = H.items.find(x=>x.date>TODAY);
    const n = next ? relsOn(next.date).length : 0;
    body.innerHTML = `<p class="none"><b>今日発売の新弾はありません</b>${next?`<a class="go" href="/releases/#d=${next.date}">次の発売は ${md(next.date)}・${n}件 ›</a>`:''}</p>`;
  } else {
    body.innerHTML = `<div class="rels">${its.map(d=>{
      const pr = d.pack ? `<span class="pr">${esc(d.pack)}</span>` : '';
      return `<a class="pk${isStar(d)?' on':''}" style="--h:${HUE[d.game]||0}" href="/releases/#i=${d.id}">${thumb(d)}<span class="t"><span class="g">${isStar(d)?'<span class="sm" role="img" aria-label="お気に入り">★</span>':''}${esc(d.game)}</span><span class="n">${esc(d.name)}</span>${pr}</span></a>`;
    }).join('')}</div>`;
  }
  const u=user(), nStar=its.filter(isStar).length;
  $('relHint').innerHTML = u ? `${esc(u.display_name||'')} さんのお気に入り（★${stars.size}件）を先頭に表示しています。`
    : nStar ? 'お気に入り（★）の商品を先頭に表示しています。'
    : stars.size ? '' : '<a href="/releases/">新弾カレンダー</a>で ☆ を付けると、お気に入りが先頭に表示されます。';
}

// ---- events (BUILD_EVENTS)
const EVENTS = !!$('evBody');
const LOC = window.snLoc;
// the /events/ games in its order (columns and chips keep it every day); c / cd = light / dark colour (palette in
// CLAUDE.md), bit = meta's game mask
const EV_GAMES = [
  {code:'OPCG', name:'ONE PIECE', short:'ワンピ', c:'#be362d', cd:'#de837c', bit:1},
  {code:'UATCG', name:'UNION ARENA', short:'ユニアリ', c:'#7a2dbe', cd:'#b17cde', bit:2},
  {code:'CONAN', name:'名探偵コナン', short:'コナン', c:'#2d81be', cd:'#7cb6de', bit:4},
  {code:'PTCG', name:'ポケモンカード', short:'ポケカ', c:'#be972d', cd:'#dec47c', bit:8},
  {code:'GCG', name:'ガンダム', short:'ガンダム', c:'#1d357c', cd:'#3b60ce', bit:16},
  {code:'DBFW', name:'DBフュージョンワールド', short:'DBFW', c:'#8a2e0f', cd:'#e45525', bit:32},
  {code:'BS', name:'バトルスピリッツ', short:'バトスピ', c:'#7c1d4d', cd:'#ce3b85', bit:64},
  {code:'DCG', name:'デジモン', short:'デジカ', c:'#12a581', cd:'#40e7be', bit:128},
  {code:'WS', name:'ヴァイスシュヴァルツ', short:'ヴァイス', c:'#d31785', cd:'#ed6eb8', bit:256},
  {code:'VG', name:'ヴァンガード', short:'ヴァンガ', c:'#808a0f', cd:'#d4e425', bit:512},
  {code:'SVE', name:'Shadowverse EVOLVE', short:'シャドバ', c:'#4d6f2a', cd:'#85b950', bit:1024},
  {code:'HOCG', name:'ホロライブ', short:'ホロライブ', c:'#a96660', cd:'#cfadaa', bit:2048},
  {code:'LLOCG', name:'ラブライブ！OCG', short:'ラブライブ', c:'#366063', cd:'#62a1a7', bit:4096}
];
const EVG = Object.fromEntries(EV_GAMES.map(g=>[g.code,g]));
const gvars = g => `--gl:${g.c};--gd:${g.cd}`;
const SAVED_KEY = 'tcg.ev.filters';
// the /events/ saved filters (one location; older saves with several keep the first). days is left out: today is today.
function evFilters(){
  const s=store.get(SAVED_KEY,null)||{};
  const list=k=>typeof s[k]==='string'?s[k].split(',').filter(Boolean):[];
  return {pref:EVENTS?list('pref').filter(LOC.isLoc)[0]||'':'', game:list('game').filter(g=>EVG[g]).join(','), type:list('type').filter(t=>/^[a-z0-9_]+$/.test(t)).join(',')};
}
// query parameters in the order /events/ builds them, so both pages share the API cache entries
function q(f,extra){
  const p=new URLSearchParams(extra.api||{});
  if(f.game) p.set('game',f.game);
  p.set('pref',f.pref);
  if(f.type) p.set('type',f.type);
  Object.entries(extra.tail||{}).forEach(([k,v])=>p.set(k,v));
  return p.toString().replace(/%2C/g,',');
}
// game: one game's day view instead of the saved game filter
const dayLink = (f,d,game) => '/events/?'+q(game?{...f,game}:f,{tail:{range:'custom',from:d,to:d}});
const monthLink = f => '/events/?'+q(f,{});
const SHOW = n => n<=2 ? 5 : 3; // events listed per game column for n columns
let evF=null, evKey=null, ev=null; // ev: {loading} | {error} | {counts, byGame, list}
async function api(path,query){
  const r=await fetch(`${API_BASE}${path}${query?'?'+query:''}`,{headers:{accept:'application/json'}});
  let body=null; try{ body=await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error('HTTP '+r.status),{status:r.status});
  return body;
}
const codesOf = e => Array.isArray(e.game_codes)&&e.game_codes.length ? e.game_codes : [e.game_code];
// Today's games with events (by_game of /days, which already follows the saved game filter), in EV_GAMES order.
function todayGames(){
  const bg=ev.byGame[TODAY];
  if(bg) return EV_GAMES.filter(g=>bg[g.code]>0).map(g=>({g, n:bg[g.code]}));
  // /days without by_game: what the loaded page holds
  const n={}; ev.list.filter(e=>e.starts_on===TODAY).forEach(e=>codesOf(e).forEach(c=>n[c]=(n[c]||0)+1));
  return EV_GAMES.filter(g=>n[g.code]).map(g=>({g, n:n[g.code]}));
}
// At most MAX_COLS columns: the games with the most events today (ties in EV_GAMES order), still in EV_GAMES order.
const MAX_COLS = 5;
function todayCols(){
  const all=todayGames();
  if(all.length<=MAX_COLS) return all;
  const top=new Set([...all].sort((a,b)=>b.n-a.n).slice(0,MAX_COLS));
  return all.filter(c=>top.has(c));
}
// Within a day: today, events that already started follow the upcoming ones; cancelled ones go last (as on /events/).
const started = e => e.starts_on===TODAY && e.time_precision==='datetime' && !!e.starts_at && Date.parse(e.starts_at)<=Date.now();
const dayRank = e => e.event_status==='cancelled' ? 2 : started(e) ? 1 : 0;
const rowsFor = (code,d) => ev.list.filter(e=>e.starts_on===d && codesOf(e).includes(code)).sort((a,b)=>dayRank(a)-dayRank(b));
async function loadEvents(force){
  if(!EVENTS) return;
  evF=evFilters();
  const key=JSON.stringify(evF);
  if(!evF.pref){ evKey=key; ev=null; renderEv(); renderWeek(); return; }
  if(key===evKey && !force) return;
  evKey=key; ev={loading:true}; renderEv(); renderWeek();
  const ym=TODAY.slice(0,7), next=addM(ym,1)+'-01', f=evF;
  try{
    const [days,page]=await Promise.all([
      api('/events/days',q(f,{api:{from:ym+'-01',until:next}})),
      api('/events',q(f,{api:{from:TODAY,until:next},tail:{limit:50}}))]);
    if(key!==evKey) return;
    const ds=days.days||[];
    ev={counts:Object.fromEntries(ds.map(d=>[d.date,d.count])), byGame:Object.fromEntries(ds.filter(d=>d.by_game).map(d=>[d.date,d.by_game])), list:page.events||[]};
    renderEv(); renderWeek();
    // The page runs in start order across all games, so a busy game can fill it before the others start: one more
    // page (the /events/ list's second, same key) when a column would show fewer than it could.
    const last=ev.list[ev.list.length-1], cols=todayCols();
    // Upcoming events come first in a column, so a column whose loaded rows are mostly over also asks for it.
    if(page.next_cursor && last && last.starts_on===TODAY && cols.some(c=>{ const rs=rowsFor(c.g.code,TODAY); return rs.length<c.n && rs.filter(e=>!dayRank(e)).length<SHOW(cols.length); })){
      const more=await api('/events',q(f,{api:{from:TODAY,until:next},tail:{limit:50,cursor:page.next_cursor}}));
      if(key!==evKey) return;
      ev.list=ev.list.concat(more.events||[]);
    }
  }catch(e){
    if(key!==evKey) return;
    if(!ev||!ev.counts) ev={error:e};
  }
  renderEv(); renderWeek();
}
const timeFmt = tz => new Intl.DateTimeFormat('ja-JP',{timeZone:tz||'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false});
const isPostcode = s => /^〒?\s*\d{3}-?\d{4}$/.test(String(s||'').trim());
const venueLabel = v => !v ? '' : isPostcode(v.name) && v.address ? v.address : v.name;
const timeOf = e => e.time_precision==='datetime'&&e.starts_at ? timeFmt(e.timezone).format(new Date(e.starts_at)) : '';
// in a game's column; an event shared with other games names them
function evRow(e,col){
  const t=timeOf(e);
  const tm = t ? `<span class="tm">${t}</span>` : '<span class="tm tbd">時刻未定</span>';
  const where = e.attendance_mode==='online' ? 'オンライン開催' : venueLabel(e.venue) || '会場は公式で確認';
  const st = e.event_status==='cancelled' ? '<span class="st">中止</span>' : e.event_status==='postponed' ? '<span class="st">延期</span>' : '';
  const tags = codesOf(e).filter(c=>c!==col).map(c=>{ const x=EVG[c]||{name:c,c:'#8a8f9e',cd:'#8a8f9e'}; return `<span class="tag" style="${gvars(x)}">${esc(x.name)}</span>`; }).join('');
  return `<li class="ev${e.event_status==='cancelled'?' off':started(e)?' done':''}">${tm}<a href="${esc(e.source_url)}" target="_blank" rel="noopener">${st}${esc(e.name)}<span class="sr">（外部サイト）</span></a><p>${tags}${esc(where)}</p></li>`;
}
const PIN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
function renderEv(){
  if(!EVENTS) return;
  const body=$('evBody'), f=evF||evFilters();
  const filt=[f.game&&f.game.split(',').map(c=>EVG[c].name).join('・'), f.type&&'形式で絞り込み中'].filter(Boolean).join('・');
  $('evWhere').innerHTML = f.pref ? `<button type="button" class="locbtn" id="locBtn" aria-haspopup="dialog" aria-label="地域: ${esc(LOC.locName(f.pref))}（変更）">${PIN}${esc(LOC.locName(f.pref))}<small>変更</small></button>${filt?`<span>${esc(filt)}</span>`:''}` : '';
  const n = ev&&ev.counts ? ev.counts[TODAY]||0 : 0;
  $('evN').innerHTML = ev&&ev.counts ? `<b>${n}</b> 件` : '';
  $('evGo').href = f.pref ? (n ? dayLink(f,TODAY) : monthLink(f)) : '/events/';
  $('evHint').textContent = f.pref && user() ? 'アカウントに保存した地域・絞り込みで表示しています。' : '';
  if(!f.pref){
    body.innerHTML = `<div class="none"><b>地域を選ぶと、今日のイベントをタイトル別に表示します</b><span>都道府県（またはオンライン）を1つ選びます。イベントカレンダーと共通の設定です。</span><button type="button" class="go" id="pickLoc" aria-haspopup="dialog">都道府県を選ぶ</button></div>`;
    return;
  }
  if(!ev || ev.loading){ body.innerHTML='<div class="sk" aria-hidden="true"></div><div class="sk" aria-hidden="true" style="margin-top:6px"></div><span class="sr">読み込み中…</span>'; return; }
  if(ev.error){
    const busy=ev.error.status===429||ev.error.status===503;
    body.innerHTML = `<div class="none err"><b>${busy?'混み合っています':'イベント情報を読み込めませんでした'}</b><span>${busy?'少し時間をおいて、もう一度お試しください。':'通信状況を確認して、もう一度お試しください。'}</span><button class="go" id="evRetry" type="button">再読み込み</button></div>`;
    return;
  }
  if(!n){
    const nx=Object.keys(ev.counts).filter(d=>d>TODAY).sort()[0];
    body.innerHTML = `<p class="none"><b>今日、${esc(LOC.locName(f.pref))}で予定されているイベントはありません</b>${nx?`<a class="go" href="${esc(dayLink(f,nx))}">次は ${md(nx)}・${ev.counts[nx]}件 ›</a>`:''}</p>`;
    return;
  }
  const cols=todayCols(), k=SHOW(cols.length), hidden=todayGames().filter(c=>!cols.some(x=>x.g===c.g));
  const others = hidden.length ? `<div class="gcs gmore"><span class="lab">ほかのタイトル</span>${hidden.map(({g,n})=>`<a class="gc" style="${gvars(g)}" href="${esc(dayLink(f,TODAY,g.code))}" title="${esc(g.name)}・${n}件"><span><i aria-hidden="true"></i>${esc(g.name)}</span><b>${n}</b></a>`).join('')}</div>` : '';
  body.innerHTML = `<div class="gcols" style="--n:${Math.max(cols.length,1)}">${cols.map(({g,n})=>{
    const rows=rowsFor(g.code,TODAY).slice(0,k), rest=n-rows.length, href=esc(dayLink(f,TODAY,g.code));
    const list = rows.length ? `<ul class="evs">${rows.map(e=>evRow(e,g.code)).join('')}</ul>` : '';
    const more = !rows.length ? `<a class="go more" href="${href}">${n}件をイベントカレンダーで見る ›</a>`
      : rest>0 ? `<a class="go more" href="${href}">ほか ${rest}件 ›</a>` : `<a class="go more" href="${href}">地図で見る ›</a>`;
    return `<section class="gcol" style="${gvars(g)}" aria-label="${esc(g.name)}"><h3><span class="gn"><i aria-hidden="true"></i>${esc(g.name)}</span><span class="c"><b>${n}</b> 件</span></h3>${list}${more}</section>`;
  }).join('')}</div>${others}`;
}

// ---- tomorrow and the rest of the week: releases, and with a location the events per game (this month's /days only;
// later days link to the day view without a count, no extra request)
function renderWeek(){
  const f=EVENTS?(evF||evFilters()):null, ym=TODAY.slice(0,7);
  const evOk = f&&f.pref&&ev&&ev.counts;
  $('wkSub').textContent = `${md(WEEK[0])}〜${md(WEEK[WEEK.length-1])}`;
  $('wkBody').innerHTML = WEEK.map((d,i)=>{
    const w=dowOf(d), its=covered(d)?relsOn(d):null, rel=its&&its.length;
    const known = evOk && d.slice(0,7)===ym;
    const bg = known ? ev.byGame[d]||{} : null, total = known ? ev.counts[d]||0 : 0;
    let chips='';
    if(f&&f.pref&&known){
      const gs=EV_GAMES.filter(g=>bg[g.code]>0);
      chips = gs.length ? gs.map(g=>`<a class="gc" style="${gvars(g)}" href="${esc(dayLink(f,d,g.code))}" title="${esc(g.name)}・${bg[g.code]}件"><span><i aria-hidden="true"></i>${esc(rel?g.short:g.name)}</span><b>${bg[g.code]}</b></a>`).join('')
        : total ? `<a class="gc any" href="${esc(dayLink(f,d))}">イベント <b>${total}</b></a>` : '';
    } else if(f&&f.pref&&!(ev&&ev.loading)) chips=`<a class="gc any" href="${esc(dayLink(f,d))}">イベント ›</a>`;
    let top;
    if(its==null) top='<p class="q">発売情報は新弾カレンダーで</p>';
    else if(rel) top=`<ul>${its.slice(0,3).map(x=>`<li class="${isStar(x)?'st':''}"><a href="/releases/#i=${x.id}" style="--h:${HUE[x.game]||0}" title="${esc(x.game+' / '+x.name)}"><i aria-hidden="true"></i><span class="gl">${esc(SHORT[x.game]||x.game)}</span>${esc(x.name)}</a></li>`).join('')}</ul><a class="rl" href="/releases/#d=${d}">発売 <b>${its.length}</b>件 ›</a>`;
    else {
      // no releases: a few of the day's events when the loaded pages reach it (start order), else just the counts
      const evs = known ? ev.list.filter(e=>e.starts_on===d).sort((a,b)=>dayRank(a)-dayRank(b)).slice(0,2) : [];
      top = evs.length ? `<ul>${evs.map(e=>{ const g=EVG[codesOf(e)[0]]||{c:'#8a8f9e',cd:'#8a8f9e'}; return `<li class="e"><a href="${esc(e.source_url)}" target="_blank" rel="noopener" style="${gvars(g)}" title="${esc(e.name)}"><i aria-hidden="true"></i>${timeOf(e)?`<b>${timeOf(e)}</b>`:''}${esc(e.name)}</a></li>`; }).join('')}</ul>`
        : chips ? '' : `<p class="q">${f&&f.pref&&known?'発売・イベントなし':'発売なし'}</p>`;
    }
    return `<div class="wd${its&&!rel&&chips?' norel':''}"><h3>${+d.slice(5,7)}/${+d.slice(8)}<span class="dw ${w==0?'sun':w==6?'sat':''}">${DOW[w]}曜</span>${i===0?'<span class="lb">明日</span>':''}</h3>${top}${chips?`<div class="gcs">${chips}</div>`:''}</div>`;
  }).join('');
}

// ---- location: the picker shared with /events/ (src/locpick.html). Its counts need /events/meta, asked for only
// once the dialog is opened (same key as /events/).
let meta=null, metaAsked=false;
function locCounts(){
  if(!meta) return null;
  const f=evF||evFilters(), game=f.game?f.game.split(','):[], type=f.type?f.type.split(','):[];
  const r=LOC.countsFromMeta(meta,{mask:game.reduce((b,c)=>b|EVG[c].bit,0), type, months:[TODAY.slice(0,7)]});
  return r && {...r, filtered:!!(game.length||type.length), label:r.all?`${+TODAY.slice(5,7)}月のイベント数`:'掲載中のイベント数'};
}
function openLoc(){
  if(!metaAsked){ metaAsked=true; api('/events/meta').then(m=>{ meta=m; LOC.refresh(); },()=>{}); }
  LOC.open({current:()=>evFilters().pref, counts:locCounts, onPick:c=>{
    const s=store.get(SAVED_KEY,null), o=s&&typeof s==='object'?{...s}:{};
    if(o.pref!==c){
      o.pref=c; store.set(SAVED_KEY,o);
      if(window.snPrefs) window.snPrefs.changed();
      track('home_location',{value:c});
      loadEvents();
    }
    $('locBtn')?.focus();
  }});
}

function renderAll(){ renderRel(); renderEv(); renderWeek(); }
readStars(); renderAll(); loadEvents();
document.addEventListener('click',e=>{
  if(e.target.closest('#evRetry')) loadEvents(true);
  else if(e.target.closest('#locBtn,#pickLoc')) openLoc();
});
// logged in, corner.html replaces the local favourites / saved filters with the account's: re-read them
document.addEventListener('sn:prefs',()=>{ readStars(); renderAll(); loadEvents(); if(LOC) LOC.refresh(); });
document.addEventListener('sn:user',()=>{ renderRel(); renderEv(); });
})();
</script>

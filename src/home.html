<!--
  The today page (/). "Today" is Asia/Tokyo, computed in the browser: the site is rebuilt only on deploys, so build.py
  embeds the releases from build day -1 to +14 (HOME) and the page says so when it runs past that window.
  Events (EVENTS parts, BUILD_EVENTS on), only with a saved location: /events/days for this month and the first /events
  page from today, the cache keys /events/ uses too; one more page (the /events/ list's second page) only when a game
  column of today would otherwise stay short. Choosing another day in the week strip asks for that day's /events page
  (from the day, the /events/ day view's key) only when the loaded rows do not cover it: at most one request per day,
  kept for the visit. /events/meta only once the location picker is opened (its counts).
  The location is the /events/ saved filter's (src/locpick.html), so changing it here changes it there.
  いま話題 (VOICES parts, VOICES_ENABLED on): the latest /voices/ snapshot, one GET of H.voicesApi (/api/v1/voices/latest),
  drawn with the game palette in H.voiceGames; it only reads the /voices/ and /events/ saved game filters (changed on
  /voices/), never writes them.
  表示中 pill (next to the h1 date): the saved titles (tcg.voices' game filter on VOICES builds, else the /events/ one) and
  the /events/ location; the only place they are set. It opens #hsDlg, which writes the titles to both filters
  (tcg.voices only when it exists or holds a title /events/ has not) and the location through the shared picker; without
  a location the イベント block's 地域を設定 opens the picker. The week strip (today + 6 days, tabs) picks the day: its
  releases of those titles grouped by title on the left, its events as one collapsible row per game on the right, いま話題
  under them (desktop; one column below 901px).
-->
<title>今日発売のTCG・トレカ新弾とイベント｜トレカカレンダー</title>
<style>/*SITE_CSS*/</style>
<style>
.home{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* top row: today's date (h1), the 表示の設定 pill, the week strip on the right (below the date on phones / tablets) */
.htop{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:2px}
/* date + 今日 on one line, the heading text under them (the h1 stays as wide as the longer line) */
.hbar{margin:0;display:grid;grid-template-columns:auto auto;justify-content:start;align-items:center;gap:2px 8px}
.hbar .tb{justify-self:start}
.hbar .hsub{grid-column:1/-1;font-family:var(--body);font-size:12.5px;font-weight:700;color:var(--muted)}
.hbar b{font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,28px);line-height:1.2}
.tb{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--foil-ink);background:var(--foil);border-radius:4px;padding:2px 6px}
.pill{font:inherit;font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;align-items:center;gap:6px;max-width:min(260px,100%);min-width:0;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:4px 10px 4px 12px;cursor:pointer}
.pill:hover{border-color:var(--accent)}
.pill #hsT{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .loc{display:inline-flex;align-items:center;gap:3px;white-space:nowrap;color:var(--muted)}
.pill .loc:empty{display:none}
.pill .loc svg{color:var(--accent);flex:none}
.pill .chev{flex:none;color:var(--muted)}
.wkw{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:0}
.wkl{margin:0;display:flex;gap:10px;font-size:12px;color:var(--muted)}
.wkl>span{display:inline-flex;align-items:center;gap:4px}
/* the strip: today + 6 days as tabs; a count only where there is something (発売 filled, イベント outlined) */
.wks{display:flex;gap:4px}
.wdy{font:inherit;color:var(--ink);cursor:pointer;border:1px solid transparent;border-radius:8px;background:none;padding:4px 6px 5px;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:3px}
.wdy:hover{border-color:var(--line);background:var(--surface)}
.wdy[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.wdy.today{box-shadow:inset 0 3px 0 var(--foil)}
.wdy.today[aria-selected="true"]{box-shadow:inset 0 3px 0 var(--foil),inset 0 0 0 1px var(--accent)}
.wdy .dt{display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.wdy .dt b{font-family:var(--mono);font-size:15px}
.wdy .dw{font-size:12px;font-weight:700;color:var(--muted)}
.wdy .dw.sat{color:var(--sat)} .wdy .dw.sun{color:var(--sun)}
.wdy .ct{display:flex;gap:3px;min-height:18px;align-items:center}
.cr,.ce{display:inline-block;box-sizing:border-box;height:16px;font-family:var(--mono);font-size:12px;font-weight:700;line-height:16px;min-width:18px;text-align:center;border-radius:9px;padding:0 5px;white-space:nowrap}
.cr{background:var(--accent);color:var(--accent-ink)}
.ce{border:1px solid var(--muted);color:var(--ink);line-height:14px}
.cr.u,.ce.u{background:none;border:0;color:var(--faint);font-weight:500}
.cr .sm{color:var(--foil-hi);margin-left:2px}
/* the chosen day (the tab panel): 発売 on the left, イベント on the right with いま話題 under it */
.hgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);grid-template-rows:auto 1fr;gap:12px;align-items:start}
.hgrid>.wkp{grid-column:1/-1;grid-row:1/3;display:grid;grid-template-columns:subgrid;grid-template-rows:subgrid;align-items:start;min-width:0}
.wkp>.rel{grid-column:1;grid-row:1/3}
.wkp>.evb{grid-column:2;grid-row:1}
.hgrid>.vtr{grid-column:2;grid-row:2}
.hgrid:not(:has(.evb)){grid-template-columns:minmax(0,1fr)}
.hgrid:not(:has(.evb))>.wkp>.rel{grid-column:1/-1}
/* a day without releases: 発売 one line across the top, いま話題 (wider) on the left, イベント on the right */
.hgrid:has(.rel0)>.wkp>.rel{grid-column:1/-1;grid-row:1}
.hgrid:has(.rel0):has(.evb)>.wkp>.evb{grid-row:2}
.hgrid:has(.rel0):has(.evb)>.vtr{grid-column:1;grid-row:2}
.hgrid:has(.rel0):has(.evb)>.vtr .vts{grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}
.hgrid:has(.rel0):not(:has(>.vtr:not([hidden])))>.wkp>.evb{grid-column:1/-1}
.rel0 .blk-h{align-items:center}
.rel0 .q{font-size:13px}
.rel0 .nx{font:inherit;font-size:13px;font-weight:700;color:var(--accent);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.rel0 .nx:hover{border-color:var(--accent)}
.rel0 .rl{font-size:13px}
.wkp:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:14px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.blk-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0}
.blk-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.3}
.blk-h .dd{font-family:var(--mono);font-size:13px;font-weight:700}
.blk-h .sub{font-size:12.5px;font-weight:700;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.blk-h .n{font-size:12.5px;color:var(--muted);white-space:nowrap}
.blk-h .n b{font-family:var(--mono);color:var(--ink)}
.blk-h .dayl{margin-left:auto}
.dayl{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;white-space:nowrap}
.dayl:hover{text-decoration:underline}
.blk-f{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.go{font:inherit;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);white-space:nowrap;cursor:pointer}
.go:hover{border-color:var(--accent)}
.hint{margin:0;font-size:12px;color:var(--muted)}
div.none{margin:0;padding:18px 12px;border:1px dashed var(--line);border-radius:10px;text-align:center;color:var(--muted);font-size:13px;display:grid;gap:8px;justify-items:center}
div.none b{color:var(--ink);font-size:14px}
div.none.err{border-color:var(--sun);border-style:solid}
.q{margin:0;font-size:13px;color:var(--muted)}
/* 発売: one group per title (icon + name once), rows of thumbnail, name without the repeated title / series, price */
.rels{display:grid;gap:12px}
.rg h3{margin:0 0 2px;font-size:14px;line-height:1.4;display:flex;align-items:center;gap:6px;color:hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 6%))}
.rg h3 .gn{display:inline-flex;align-items:center;gap:6px;min-width:0}
.rg h3 .gi{--gi:16px}
.rg h4{margin:6px 0 0;padding:3px 8px;border-radius:6px;background:var(--surface-2);font-size:12.5px;font-weight:700;color:var(--muted)}
.rows{list-style:none;margin:0;padding:0}
.rels .pk{grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;padding:5px 4px}
.rels .pk::before{display:none}
.rels .pk:hover{background:var(--surface-2)}
.rels .pk .th{width:30px}
.rels .pk .t{display:flex;flex-direction:row;align-items:baseline;gap:4px;min-width:0}
.rels .pk .n{font-size:14px;color:inherit}
.rels .pk:hover .n{color:var(--accent)}
.rels .pk .pr{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.rels .pk.on{background:var(--foil-soft)}
.pk .sm{color:var(--foil);flex:none}
.rl{align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none}
.rl b{font-family:var(--mono)}
.rl:hover{text-decoration:underline}
.relo{margin:2px 0 0}
/* イベント: one row per game (its count); opened, the type line and the rows (src/evrow.html) */
.gcols{display:grid;gap:6px}
.gcol{border:1px solid var(--line);border-left:3px solid var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)));border-radius:8px;background:var(--surface-2);min-width:0}
.gcol h3{position:relative;margin:0;display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:14px;line-height:1.35}
.gcol h3 .gn{display:inline-flex;align-items:center;gap:6px;min-width:0;color:var(--gt,hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 8%)))}
.gt{all:unset;margin-left:auto;cursor:pointer;display:inline-flex;align-items:center;font-size:12.5px;color:var(--muted);white-space:nowrap}
.gt b{font-family:var(--mono);font-size:13px;color:var(--ink)}
.gt::after{content:"";position:absolute;inset:0;border-radius:6px}
.gt:focus-visible::after{outline:2px solid var(--accent);outline-offset:1px}
.gt svg{margin-left:6px;transition:transform .15s}
.gt[aria-expanded="true"] svg{transform:rotate(180deg)}
.gcol h3:hover .gt b{color:var(--accent)}
.gb{display:flex;flex-direction:column;gap:6px;padding:0 8px 8px}
.gb[hidden]{display:none}
.gcol .more{align-self:flex-start;font-size:12.5px;padding:3px 10px}
.gcol .ty{margin:0 2px;font-size:12px;line-height:1.4;color:var(--muted)}
.gcol .ty b{font-family:var(--mono);font-weight:700;color:var(--ink)}
.evs{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.evs .ev{gap:2px;background:var(--surface);border-radius:8px;padding:7px 9px}
.evs .ev-n{font-size:14px;line-height:1.4;text-decoration:none}
.evs a.ev-n:hover .t{color:var(--accent);text-decoration:underline}
.evs .ev-m{font-size:12.5px}
.evs .ev-s{margin-top:1px}
.evs .evg-l .ev{padding:4px 0 4px 2px;background:none;border-radius:0}
.sk{height:40px;border-radius:8px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%}
@media (prefers-reduced-motion:no-preference){.sk{animation:sk 1.2s linear infinite}@keyframes sk{to{background-position:-200% 0}}}
.gcs{display:flex;flex-wrap:wrap;gap:4px}
.gcs.gmore{align-items:center;margin-top:4px}
.gmore .lab{font-size:12px;color:var(--muted);margin-right:2px}
.gc{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:none;border:1px solid var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)));background:var(--gtint,hsl(var(--h) 70% var(--tint-l)));border-radius:999px;padding:1px 8px 1px 6px;white-space:nowrap;min-width:0}
.gc>span{display:inline-flex;align-items:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.gc b{font-family:var(--mono)}
.gc:hover{box-shadow:0 0 0 1px var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)))}
/* 表示の設定 */
.setdlg fieldset{border:0;margin:0;padding:10px 0 0;border-top:1px solid var(--line);display:grid;gap:8px;min-width:0}
.setdlg legend{float:left;width:100%;font-size:12px;font-weight:700;color:var(--muted);padding:0}
.setdlg .fc{clear:both;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.setdlg .chip{font-size:13px;cursor:pointer}
.setdlg .note{margin:0;font-size:12.5px;color:var(--muted)}
.setdlg .lc{font-weight:700}
.setdlg .foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.go.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
/* いま話題 (VOICES): the latest /voices/ snapshot. Game colours, attitude colours and glyphs as on /voices/
   (src/voices.html): --gl/--gd per game give --g (marks) and --gt (text, >=4.5:1) per theme. */
.vtr{--pos:#1d7f4c;--mix:#94580a;--neg:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vtr{--pos:#5fd39a;--mix:#f0b44c}}
:root[data-theme="dark"] .vtr{--pos:#5fd39a;--mix:#f0b44c}
.vtr .a-positive{--a:var(--pos)} .vtr .a-negative{--a:var(--neg)} .vtr .a-mixed{--a:var(--mix)} .vtr .a-neutral{--a:var(--muted)}
.vtr [style*="--gl"]{--g:var(--gl);--gt:color-mix(in oklab,var(--gl) 65%,#000)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vtr [style*="--gl"]{--g:var(--gd);--gt:color-mix(in oklab,var(--gd) 60%,#fff)}}
:root[data-theme="dark"] .vtr [style*="--gl"]{--g:var(--gd);--gt:color-mix(in oklab,var(--gd) 60%,#fff)}
.vtr[hidden]{display:none}
/* one compact row per topic (game, attitude, status, title; the summary is the link's title): a single list in the right

.vts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.vts>li{display:flex;min-width:0}

.vt:hover{border-color:var(--accent);border-left-color:var(--g)}
.vt:hover:not(:has(a.gl:hover)) .tt{color:var(--accent);text-decoration:underline}
.vt .tt{color:inherit;text-decoration:none}
.vt .tt::after{content:"";position:absolute;inset:0}
.vt .tt:focus-visible{outline:none}
.vt:has(.tt:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.vt .vh{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:12px;font-weight:700}

.vt .am{color:var(--a);white-space:nowrap}

.vt .badge.new{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.vt .badge.hot{border-color:var(--foil);background:var(--foil-soft);color:var(--ink)}
.vt .badge.cool{color:var(--muted)}
.vt .tt{font-family:var(--runtime);overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;font-weight:700;line-height:1.45;-webkit-line-clamp:2}
.vtr .blk-f .dayl{margin-left:auto}
@media (max-width:1023px){
  .wkw{flex:1 1 100%;margin-left:0;flex-direction:column-reverse;align-items:stretch}

}
@media (max-width:900px){
  .hgrid{grid-template-columns:minmax(0,1fr);grid-template-rows:none}
  .hgrid>.wkp{grid-column:auto;grid-row:auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:none;gap:12px}
  .wkp>.rel,.wkp>.evb,.hgrid>.vtr{grid-column:auto;grid-row:auto}
  .hgrid:has(.rel0)>.wkp>.rel,.hgrid:has(.rel0):has(.evb)>.wkp>.evb,.hgrid:has(.rel0):has(.evb)>.vtr,.hgrid:has(.rel0)>.wkp>.evb{grid-column:auto;grid-row:auto}
  .vts{grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr))}
}

  .blk{padding:12px;border-radius:12px}
  .gcol .ty{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .wks{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:0 -12px;padding:2px 12px 4px;scroll-padding:0 12px}
  .wks::-webkit-scrollbar{display:none}

<script>
(function(){
const H = /*HOME*/null;
const API_BASE = /*API_BASE*/'/api/v1';
/*GICON*/

// A day's releases of the saved titles plus favourites of any title, favourites first: one group per title (its icon and
// name once, linking the hub), each row a thumbnail, the name and the price. A row drops the leading title name only when
// it is exactly the group's, and rows of the group sharing their first word(s) go under one subheading with that series
// prefix (whole words only, at least one word left per row, so version / vol. numbers never vanish); the full name stays
// the link's accessible name.
const words = s => s.split(/[\s\u3000]+/).filter(Boolean);
function relGroups(its){
  const by=new Map();
  its.forEach(d=>{ if(!by.has(d.game)) by.set(d.game,[]); by.get(d.game).push(d); });
  return [...by].map(([game,ds])=>{
    const rows=ds.map(d=>{ const w=words(d.name), g=words(game), cut=w.length>g.length&&g.every((x,i)=>w[i]===x); return {d, pre:cut?g:[], w:cut?w.slice(g.length):w}; });
    // series: rows of 2+ words sharing their first word; the prefix is their longest common run of words, one short of the shortest
    const first=new Map();
    rows.forEach(r=>{ if(r.w.length>1) first.set(r.w[0],(first.get(r.w[0])||[]).concat([r])); });
    const out=[], done=new Set();
    rows.forEach(r=>{
      if(done.has(r)) return;
      const mates=r.w.length>1?first.get(r.w[0]):null;
      if(!mates||mates.length<2){ out.push(r); return; }
      let k=1; const max=Math.min(...mates.map(m=>m.w.length))-1;
      while(k<max && mates.every(m=>m.w[k]===r.w[k])) k++;
      mates.forEach(m=>done.add(m));
      out.push({series:r.w.slice(0,k).join(' '), rows:mates.map(m=>({...m, pre:m.pre.concat(m.w.slice(0,k)), w:m.w.slice(k)}))});
    });
    return {game, rows:out};
  });
}
const relRow = r => {

};

    ? `<li class="rsg"><h4>${esc(r.series)}</h4><ul class="rows">${r.rows.map(relRow).join('')}</ul></li>` : relRow(r)).join('')}</ul></section>`).join('')}</div>`;

const EV_GAMES = /*EV_GAMES*/[];

const SAVED_KEY = 'tcg.ev.filters';
// the /events/ saved filters (one location; older saves with several keep the first). days is left out: today is today.
function evFilters(){

  return {pref:EVENTS?list('pref').filter(LOC.isLoc)[0]||'':'', game:list('game').filter(g=>EVG[g]).join(','), type:list('type').filter(t=>/^[a-z0-9_]+$/.test(t)).join(',')};
}
// query parameters in the order /events/ builds them, so both pages share the API cache entries
function q(f,extra){
  const p=new URLSearchParams(extra.api||{});
  if(f.game) p.set('game',f.game);
  p.set('pref',f.pref);
  if(f.type) p.set('type',f.type);

// game: one game's day view instead of the saved game filter
const dayLink = (f,d,game) => '/events/?'+q(game?{...f,game}:f,{tail:{range:'custom',from:d,to:d}});
const SHOW = n => n<=2 ? 5 : 3; // events listed per game column for n columns
let evF=null, evKey=null, ev=null; // ev: {loading} | {error} | {counts, byGame, byGameType, list, next}
// rows of a day the loaded pages do not cover: date -> {loading} | {error} | {list, more}, this filter and visit only
let dayPages={};
async function api(path,query){
  const r=await fetch(`${API_BASE}${path}${query?'?'+query:''}`,{headers:{accept:'application/json'}});
  let body=null; try{ body=await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error('HTTP '+r.status),{status:r.status});
  return body;
}
const codesOf = e => Array.isArray(e.game_codes)&&e.game_codes.length ? e.game_codes : [e.game_code];
// A day's games with events: by_game of /days (this month; it already follows the saved game filter), else what the
// loaded rows hold, kept to the saved game filter as /days keeps them (a shared event names other games too); in
// EV_GAMES order.
const inFilter = c => !evF||!evF.game||evF.game.split(',').includes(c);
function dayGames(d,list,bg){
  if(bg) return EV_GAMES.filter(g=>bg[g.code]>0).map(g=>({g, n:bg[g.code]}));
  const n={}; list.filter(e=>e.starts_on===d).forEach(e=>codesOf(e).filter(inFilter).forEach(c=>n[c]=(n[c]||0)+1));
  return EV_GAMES.filter(g=>n[g.code]).map(g=>({g, n:n[g.code]}));
}
// At most MAX_COLS columns: the games with the most events (ties in EV_GAMES order), still in EV_GAMES order.
const MAX_COLS = 5;
function topCols(all){
  if(all.length<=MAX_COLS) return all;
  const top=new Set([...all].sort((a,b)=>b.n-a.n).slice(0,MAX_COLS));
  return all.filter(c=>top.has(c));
}
// Within a day: today, events that already started follow the upcoming ones; cancelled ones go last (as on /events/).
const started = e => e.starts_on===TODAY && e.time_precision==='datetime' && !!e.starts_at && Date.parse(e.starts_at)<=Date.now();
const dayRank = e => e.event_status==='cancelled' ? 2 : started(e) ? 1 : 0;
const rowsFor = (code,d,list) => list.filter(e=>e.starts_on===d && codesOf(e).includes(code)).sort((a,b)=>dayRank(a)-dayRank(b));
const nextMonth1 = d => addM(d.slice(0,7),1)+'-01';
// The rows for day d. A page runs in start order from its first day to the end of that month, so it holds all of d
// (same month, not before its start) once a later row or the page's end is loaded. The first pages (from today, and
// all of today) are tried first, then every day page fetched so far; else d's own page (null: not asked for yet).
// more: rows of d may follow.
// This month a page also holds d once its rows of d reach the /days count, whatever follows.
const holds = (pg,from,d) => d>=from && d.slice(0,7)===from.slice(0,7) && (!pg.next || (!!pg.last&&pg.last>d)
  || (d.slice(0,7)===TODAY.slice(0,7) && pg.list.filter(e=>e.starts_on===d).length>=(ev.counts[d]||0)));
function daySrc(d){
  const main=ev.list, last=main[main.length-1];
  if(d.slice(0,7)===TODAY.slice(0,7) && (d===TODAY || holds({list:main, next:ev.next, last:last&&last.starts_on},TODAY,d)))
    return {list:main, more:!!ev.next&&!!last&&last.starts_on===d};
  for(const [from,pg] of Object.entries(dayPages)) if(pg.list && holds(pg,from,d)) return {list:pg.list, more:false};
  const own=dayPages[d];
  return own && own.list ? {list:own.list, more:true} : own || null;
}
// one request for a day no loaded page holds: its first /events page (from the day, as the /events/ day view asks)
function loadDay(d){
  if(dayPages[d]) return;
  const key=evKey, f=evF;
  dayPages[d]={loading:true};
  api('/events',q(f,{api:{from:d,until:nextMonth1(d)},tail:{limit:50}})).then(pg=>{
    if(key!==evKey) return;
    const list=pg.events||[], last=list[list.length-1];
    dayPages[d]={list, next:pg.next_cursor||null, last:last&&last.starts_on};
  },e=>{ if(key===evKey) dayPages[d]={error:e}; }).finally(()=>{ if(key===evKey) renderWeek(); });
}
// the day's /events count under the saved filter: /days this month; next month the day's rows once all are loaded
function dayCount(d){
  if(!ev||!ev.counts) return null;
  if(d.slice(0,7)===TODAY.slice(0,7)) return ev.counts[d]||0;
  const src=daySrc(d);
  return src&&src.list&&!src.more ? src.list.filter(e=>e.starts_on===d).length : null;
}
async function loadEvents(force){
  if(!EVENTS) return;
  evF=evFilters();
  const key=JSON.stringify(evF);
  if(!evF.pref){ evKey=key; ev=null; dayPages={}; renderWeek(); return; }
  if(key===evKey && !force) return;
  evKey=key; ev={loading:true}; dayPages={}; renderWeek();
  const ym=TODAY.slice(0,7), next=addM(ym,1)+'-01', f=evF;
  try{
    const [days,page]=await Promise.all([
      api('/events/days',q(f,{api:{from:ym+'-01',until:next}})),
      api('/events',q(f,{api:{from:TODAY,until:next},tail:{limit:50}}))]);
    if(key!==evKey) return;
    const ds=days.days||[];
    ev={counts:Object.fromEntries(ds.map(d=>[d.date,d.count])), byGame:Object.fromEntries(ds.filter(d=>d.by_game).map(d=>[d.date,d.by_game])),
      byGameType:Object.fromEntries(ds.filter(d=>d.by_game_type).map(d=>[d.date,d.by_game_type])), list:page.events||[], next:page.next_cursor||null};
    renderWeek();
    // The page runs in start order across all games, so a busy game can fill it before the others start: one more
    // page (the /events/ list's second, same key) when a column would show fewer than it could.
    const last=ev.list[ev.list.length-1], cols=topCols(dayGames(TODAY,ev.list,ev.byGame[TODAY]));
    // Upcoming events come first in a column, so a column whose loaded rows are mostly over also asks for it.
    if(page.next_cursor && last && last.starts_on===TODAY && cols.some(c=>{ const rs=rowsFor(c.g.code,TODAY,ev.list); return rs.length<c.n && rs.filter(e=>!dayRank(e)).length<SHOW(cols.length); })){
      const more=await api('/events',q(f,{api:{from:TODAY,until:next},tail:{limit:50,cursor:page.next_cursor}}));
      if(key!==evKey) return;
      ev.list=ev.list.concat(more.events||[]); ev.next=more.next_cursor||null;
    }
  }catch(e){
    if(key!==evKey) return;
    if(!ev||!ev.counts) ev={error:e};
  }
  renderWeek();
}
const timeFmt = tz => new Intl.DateTimeFormat('ja-JP',{timeZone:tz||'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false});
const isPostcode = s => /^〒?\s*\d{3}-?\d{4}$/.test(String(s||'').trim());
const venueLabel = v => !v ? '' : isPostcode(v.name) && v.address ? v.address : v.name;
const timeOf = e => e.time_precision==='datetime'&&e.starts_at ? timeFmt(e.timezone).format(new Date(e.starts_at)) : '';
if(window.snEv) snEv.init({gi, games:EVG});
// in a game's column (src/evrow.html): the column's game is not repeated; an event shared with other games names them.
// Identical events of the column (same type and name at several stores) fold into one expandable row.
const evRow = (e,col,f) => snEv.row(e,{compact:true, col, pref:f.pref, started:started(e)});
const evItem = (x,col,f,more,d) => x.e ? evRow(x.e,col,f) : snEv.grp(x,{compact:true, col, pref:f.pref, day:d+'-'+col, more, started:started(x.rows[0])});
// A column's types that day, busiest first: up to 3 named, else 2 and ほか (no type, その他 and unknown codes go to ほか).
// From /days by_game_type; next month (no /days here) from the day's loaded rows (group.event_type_code), as minimums
// (min = 以上) while more may follow.
// None for /days answers without by_game_type (cached before it existed).
const TYPES = H.types||{};
function typeLine(code,d,rows,min=''){
  let bt=(ev.byGameType[d]||{})[code];
  if(!bt&&rows){ bt={}; rows.forEach(e=>{ const t=e.group&&e.group.event_type_code||''; bt[t]=(bt[t]||0)+1; }); }
  if(!bt) return '';
  const named=Object.entries(bt).filter(([t])=>TYPES[t]&&t!=='other').sort((a,b)=>b[1]-a[1]||(a[0]<b[0]?-1:1));
  const total=Object.values(bt).reduce((a,b)=>a+b,0);
  const show=named.length<=3&&named.reduce((a,x)=>a+x[1],0)===total ? named : named.slice(0,2);
  const rest=total-show.reduce((a,x)=>a+x[1],0);
  const parts=show.map(([t,n])=>`${esc(TYPES[t])} <b>${n}</b>件${min}`).concat(rest?[`ほか <b>${rest}</b>件${min}`]:[]);
  return show.length ? `<p class="ty" title="${parts.join('・').replace(/<\/?b>/g,'')}">${parts.join('・')}</p>` : '';
}
const PIN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

let evOpen = {}; // game code -> the visitor opened / closed its row
// The day's events in the panel: one row per game (as /events/ orders them), at most MAX_COLS, the rest as chips.
// {html, n, min}: n = the day's count for the heading (null when not known), min = 以上 when it is a minimum.
function evPart(d,f){
  if(!f.pref) return {html:'<p class="q"><button type="button" class="go" id="hsLocSet" aria-haspopup="dialog">地域を設定</button></p>', n:null};
  if(!ev || ev.loading) return {html:SK, n:null, loading:true};
  if(ev.error){
    const busy=ev.error.status===429||ev.error.status===503;
    return {html:`<div class="none err"><b>${busy?'混み合っています':'イベント情報を読み込めませんでした'}</b><span>${busy?'少し時間をおいて、もう一度お試しください。':'通信状況を確認して、もう一度お試しください。'}</span><button class="go" id="evRetry" type="button">再読み込み</button></div>`, n:null, error:true};
  }
  const src=daySrc(d);

  if(src.error) return {html:'<p class="q">この日のイベント情報を読み込めませんでした。</p>', n:null, error:true};
  const known=d.slice(0,7)===TODAY.slice(0,7), bg=known?ev.byGame[d]||null:null, list=src.list;
  const loaded=list.filter(e=>e.starts_on===d).length, total=known?ev.counts[d]||0:loaded;
  if(!total) return {html:`<p class="q">この日、${esc(LOC.locName(f.pref))}で予定されているイベントはありません。</p>`, n:0};
  const all=dayGames(d,list,bg), cols=topCols(all), k=SHOW(cols.length), hidden=all.filter(c=>!cols.includes(c));
  // counts from the rows alone (no /days for the day) are a minimum while more rows may follow
  const min = !known && src.more ? '以上' : '';

  return {n:total, min, html:`<div class="gcols" style="--n:${Math.max(cols.length,1)}">${cols.map(({g,n})=>{
    const rs=rowsFor(g.code,d,list), rows=snEv.group(rs,dayRank).slice(0,k), rest=n-snEv.covered(rows), href=esc(dayLink(f,d,g.code));
    // a group's count is a minimum until the column's rows are all loaded (without by_game: the day's rows of every game)
    const partial = bg ? rs.length<n : known ? loaded<total : !!src.more;
    const ul = rows.length ? `<ul class="evs">${rows.map(x=>evItem(x,g.code,f,partial,d)).join('')}</ul>` : '';
    const more = !rows.length ? `<a class="go more" href="${href}">${n}件をイベントカレンダーで見る ›</a>`
      : rest>0 ? `<a class="go more" href="${href}">ほか ${rest}件${min} ›</a>` : `<a class="go more" href="${href}">地図で見る ›</a>`;
    // one row per game: open while the visitor keeps it open (this visit), at first only when it is the day's one game
    const open = evOpen[g.code] ?? cols.length===1;
    return `<section class="gcol" style="${gvars(g)}" aria-label="${esc(g.name)}"><h3>${gl(g.name,gi(g.name)+esc(g.name),'gn')}`
      + `<button type="button" class="gt" data-g="${g.code}" aria-expanded="${open}" aria-controls="evg${g.code}"><span class="sr">${esc(g.name)}のイベント </span><b>${n}</b>件${min}${CHEV}</button></h3>`
      + `<div class="gb" id="evg${g.code}"${open?'':' hidden'}>${typeLine(g.code,d,known?null:rs,min)}${ul}${more}</div></section>`;

const TITLE_OPTS = Object.keys(TITLES).filter(c=>VOICES||EVG[c]);
const shortList = codes => codes.slice(0,4).map(c=>SHORT[TITLES[c]]||TITLES[c]).join('・')+(codes.length>4?` ほか${codes.length-4}`:'');
function homeSel(){ const codes=savedGames(c=>TITLES[c]); return TITLE_OPTS.filter(c=>codes.includes(c)); }
function selNames(){ const sel=homeSel(); return sel.length ? new Set(sel.map(c=>TITLES[c])) : null; }
function renderSet(){
  const sel=homeSel(), t=$('hsT');
  t.textContent = sel.length ? shortList(sel) : 'すべてのタイトル';
  const p=EVENTS?evFilters().pref:'';
  $('hsBtn').title = (sel.length ? sel.map(c=>TITLES[c]).join('・') : 'すべてのタイトル')+(p?'・'+LOC.locName(p):'');
  if(EVENTS) $('hsL').innerHTML = p ? PIN+esc(LOC.locName(p)) : '';
}
// draft: the dialog's titles; edited: the visitor touched them (else confirming keeps whatever is saved, which account
// sync may change while the dialog is open)
let draft=[], edited=false;
function renderSetDlg(){
  const box=$('hsTitles'), had=box.contains(document.activeElement)?document.activeElement.dataset.t:null;
  box.innerHTML = `<button type="button" class="chip all" data-t="" aria-pressed="${!draft.length}">すべてのタイトル</button>`
    + TITLE_OPTS.map(c=>`<button type="button" class="chip" data-t="${c}" style="--h:${HUE[TITLES[c]]||0}" aria-pressed="${draft.includes(c)}">${gi(TITLES[c])}${esc(TITLES[c])}</button>`).join('');
  if(had!=null) box.querySelector(`[data-t="${had}"]`)?.focus();
  if(!EVENTS) return;
  const p=evFilters().pref;
  $('hsLoc').textContent = p ? LOC.locName(p) : '未設定';
  $('hsLocBtn').textContent = p ? '地域を変更' : '地域を設定';
}
function openSet(){
  draft=homeSel(); edited=false; renderSetDlg();
  const d=$('hsDlg'); if(d.showModal) d.showModal(); else d.setAttribute('open','');
  d.querySelector('.chip[aria-pressed="true"]')?.focus();
}
function closeSet(){ const d=$('hsDlg'); if(d.open) d.close(); }
// The titles go into /events/' game filter (its games only; synced when logged in) and, on VOICES builds, into
// tcg.voices when it exists (it is read first) or the choice holds a title /events/ has not.
function saveTitles(codes){
  const s=store.get(SAVED_KEY,null), o=s&&typeof s==='object'?{...s}:{}, eg=codes.filter(c=>EVG[c]).join(',');
  if((o.game||'')!==eg){
    if(eg) o.game=eg; else delete o.game;
    store.set(SAVED_KEY,o);
    if(window.snPrefs) window.snPrefs.changed();
  }
  if(VOICES){
    const v=store.get('tcg.voices',null);
    if(v&&typeof v==='object'){ const n={...v}; if(codes.length) n.game=codes.join(','); else delete n.game; store.set('tcg.voices',n); }
    else if(codes.some(c=>!EVG[c])) store.set('tcg.voices',{game:codes.join(',')});
  }
  track('home_titles',{value:codes.join(',')||'all'});
}
// true when the titles changed
function applySet(){
  const next=TITLE_OPTS.filter(c=>draft.includes(c));
  if(!edited||next.join()===homeSel().join()) return false;
  saveTitles(next); renderAll(); loadEvents();
  return true;
}

// ---- 今週のカレンダー: today + 6 days as tabs with the saved titles' counts; the chosen day's releases and events in the
// panel. Strip event counts from this month's /days only (next-month days show –).
let wkSel=0; // the panel's day (index in WEEK): today at first, this visit only
function dayData(d,f,sel){
  const names=sel.length?new Set(sel.map(c=>TITLES[c])):null, all=covered(d)?relsOn(d):null;
  const its=all&&(names?all.filter(x=>names.has(x.game)||isStar(x)):all);
  return {d, names, all, its, hidden:all?all.length-its.length:0, n:f&&f.pref?dayCount(d):null};
}
// the saved /events/ game filter, named (the event counts follow it: the API's query)
const evGamesLabel = f => f&&f.game ? (gs=>gs.slice(0,4).map(c=>EVG[c].short).join('・')+(gs.length>4?` ほか${gs.length-4}`:''))(f.game.split(',')) : '';
const dayLabel = i => i===0?'今日':i===1?'明日':'';
function renderWeek(){
  const f=EVENTS?(evF||evFilters()):null, sel=homeSel();
  const loading=!!(f&&f.pref&&ev&&ev.loading);
  const days=WEEK.map(d=>dayData(d,f,sel));
  const strip=$('wkStrip'), focused=strip.contains(document.activeElement), sx=strip.scrollLeft, evOn=!!(f&&f.pref);
  strip.setAttribute('aria-label',`今週の発売${evOn?'・イベント':''}（${md(WEEK[0])}〜${md(WEEK[6])}）`);
  // the event counts follow /events/' game filter (the API's query), not the pill: always named
  $('wkLg').innerHTML = '<span><span class="cr"></span>発売数</span>'+(evOn?`<span><span class="ce"></span>イベント数（${esc(evGamesLabel(f)||'すべて')}）</span>`:'');
  strip.innerHTML = days.map((x,i)=>{
    const d=x.d, w=dowOf(d), [,m,dd]=d.split('-').map(Number), lb=dayLabel(i), on=i===wkSel;
    const rel=x.its?x.its.length:null, star=!!x.its&&x.its.some(isStar);
    // events: null = no line (no location / no events build); '' = not known here (next month until its rows are in,
    // loading, failed)
    const en = !f||!f.pref ? null : x.n==null ? '' : x.n;
    const said=[`${m}月${dd}日(${DOW[w]})${lb?' '+lb:''}`, rel==null?'発売は新弾カレンダーで':`発売${rel}件${star?'（お気に入りあり）':''}`]
      .concat(en==null?[]:[en===''?(loading?'イベント読み込み中':'イベント数はイベントカレンダーで'):`イベント${en}件（${evGamesLabel(f)||'すべて'}）`]);
    // a count only where there is something; – where it is not known here, … while loading
    const relS = rel==null?'–':String(rel), evS = en==null?'':en===''?(loading?'…':'–'):String(en);
    const cr = rel==null ? '<span class="cr u">–</span>' : rel ? `<span class="cr">${rel}${star?'<span class="sm">★</span>':''}</span>` : '';
    const ce = en==null ? '' : en==='' ? `<span class="ce u">${evS}</span>` : en ? `<span class="ce">${en}</span>` : '';
    return `<button type="button" role="tab" class="wdy${i===0?' today':''}" id="wkT${i}" aria-selected="${on}" tabindex="${on?0:-1}" aria-controls="wkPanel" aria-label="${esc(said.join('、'))}" data-rel="${relS}" data-ev="${evS}">`
      + `<span class="dt"><b>${dd===1?m+'/'+dd:dd}</b><span class="dw ${w==0?'sun':w==6?'sat':''}">${DOW[w]}</span></span><span class="ct">${cr}${ce}</span></button>`;
  }).join('');
  strip.scrollLeft=sx;
  if(focused) $('wkT'+wkSel).focus();
  // a re-render (events arriving, sync) keeps the focused panel control: the same link / button, else the panel
  const p=$('wkPanel'), a=document.activeElement, key=p.contains(a)&&a!==p ? (a.getAttribute('href')||'')+'|'+a.textContent : null;
  renderPanel(days[wkSel],f,sel,days);
  // (event rows restore their own focus through snEv; this only catches what is still lost)
  if(key!=null && !p.contains(document.activeElement)) ([...p.querySelectorAll('a,button')].find(e=>(e.getAttribute('href')||'')+'|'+e.textContent===key)||p).focus();
}
function renderPanel(x,f,sel,days){
  const p=$('wkPanel'), d=x.d, [,m,dd]=d.split('-').map(Number), lb=dayLabel(wkSel);
  p.setAttribute('aria-labelledby','wkT'+wkSel);
  // the chosen day is named in the headings unless it is today (the h1)
  const day = wkSel ? `<span class="dd">${m}/${dd}(${DOW[dowOf(d)]})${lb?' '+lb:''}</span>` : '';
  const rn = x.its&&x.its.length ? `<span class="n"><b>${x.its.length}</b>件</span>` : '';
  const dayl = `<a class="dayl" href="/releases/#d=${d}">日別一覧<span class="sr">（新弾カレンダーでこの日を見る）</span> ›</a>`;
  let rel;
  if(x.all!=null && !x.its.length){
    // nothing of the shown titles: one line, with the next day of the strip that has some
    const j=days.findIndex((y,k)=>k>wkSel&&y.its&&y.its.length), y=days[j];
    const nx = y ? (([,m2,d2])=>`<button type="button" class="nx" data-day="${j}">次の発売 ${m2}/${d2}(${DOW[dowOf(y.d)]})・${y.its.length}件 ›</button>`)(y.d.split('-').map(Number)) : '';
    const others = x.hidden ? `<a class="rl" href="/releases/#d=${d}">ほかのタイトルの発売 <b>${x.hidden}</b>件 ›</a>` : '';
    rel = `<section class="blk wps rel rel0" aria-labelledby="wkRH"><div class="blk-h"><h2 id="wkRH">発売</h2>${day}`
      + `<p class="q">${x.names?'選択中のタイトルの発売はありません':'発売はありません'}</p>${nx}${others}${dayl}</div></section>`;
  } else rel = `<section class="blk wps rel" aria-labelledby="wkRH"><div class="blk-h"><h2 id="wkRH">発売</h2>${day}${rn}${dayl}</div>${relPart(x)}</section>`;
  let evs='', live='';
  if(EVENTS){
    const e=evPart(d,f);
    // the day view of the saved /events/ filter (the set counted here); without a location still that day
    const evHref = f.pref ? dayLink(f,d) : '/events/?'+new URLSearchParams([...(f.game?[['game',f.game]]:[]),...(f.type?[['type',f.type]]:[]),['range','custom'],['from',d],['to',d]]).toString().replace(/%2C/g,',');
    evs=`<section class="blk wps evb" aria-labelledby="wkEH"><div class="blk-h"><h2 id="wkEH">イベント</h2>${day}${e.n?`<span class="n"><b>${e.n}</b>件${e.min||''}</span>`:''}`
      + `<a class="dayl" href="${esc(evHref)}">日別一覧<span class="sr">（イベントカレンダーでこの日を見る）</span> ›</a></div><div id="evBody">${e.html}</div></section>`;
    live = !f.pref ? '' : e.loading ? `${m}月${dd}日のイベントを読み込み中` : e.error ? `${m}月${dd}日のイベント情報を読み込めませんでした`
      : e.n ? `${m}月${dd}日のイベント ${e.n}件${e.min||''}` : e.n===0 ? `${m}月${dd}日のイベントはありません` : '';
  }
  const kept=window.snEv?snEv.keep(p):null;
  const wide=!!p.querySelector('.rel0');
  p.innerHTML = rel+evs;
  if(wide!==!!p.querySelector('.rel0') && typeof renderVt==='function') renderVt();
  if(kept) snEv.restore(p,kept);
  // one polite status for the panel's events: loading, then the count, none or the error
  const st=$('wkLive'); if(st.textContent!==live) st.textContent=live;
}
function selDay(i,focus){
  wkSel=i; renderWeek();
  const t=$('wkT'+i); if(focus) t.focus();
  t.scrollIntoView({block:'nearest',inline:'nearest'});
  track('home_day',{offset:i});
}
$('wkPanel').addEventListener('click',e=>{ const b=e.target.closest('.nx'); if(b) selDay(+b.dataset.day,true); });
$('wkStrip').addEventListener('click',e=>{ const b=e.target.closest('[role="tab"]'); if(b) selDay(+b.id.slice(3),true); });
$('wkStrip').addEventListener('keydown',e=>{
  const k={ArrowRight:1,ArrowLeft:-1,Home:'h',End:'e'}[e.key];
  if(k==null) return;
  e.preventDefault();
  selDay(k==='h'?0:k==='e'?WEEK.length-1:(wkSel+k+WEEK.length)%WEEK.length,true);
});

// ---- location: the picker shared with /events/ (src/locpick.html). Its counts need /events/meta, asked for only
// once the dialog is opened (same key as /events/).
let meta=null, metaAsked=false;
function locCounts(){
  if(!meta) return null;
  const f=evF||evFilters(), game=f.game?f.game.split(','):[], type=f.type?f.type.split(','):[];
  const r=LOC.countsFromMeta(meta,{mask:game.reduce((b,c)=>b|EVG[c].bit,0), type, months:[TODAY.slice(0,7)]});
  return r && {...r, filtered:!!(game.length||type.length), label:r.all?`${+TODAY.slice(5,7)}月のイベント数`:'掲載中のイベント数'};
}
function openLoc(back){
  if(!metaAsked){ metaAsked=true; api('/events/meta').then(m=>{ meta=m; LOC.refresh(); },()=>{}); }
  LOC.open({current:()=>evFilters().pref, counts:locCounts, onPick:c=>{
    const s=store.get(SAVED_KEY,null), o=s&&typeof s==='object'?{...s}:{};
    if(o.pref!==c){
      o.pref=c; store.set(SAVED_KEY,o);
      if(window.snPrefs) window.snPrefs.changed();
      track('home_location',{value:c});
      loadEvents(); renderSet();
      if($('hsDlg').open) renderSetDlg();
    }
    (back||$('hsBtn'))?.focus();
  }});
}

// ---- いま話題 (VOICES): the latest /voices/ snapshot, fetched once from H.voicesApi, read only. Games: the /voices/ saved
// title filter (tcg.voices), else the /events/ one (tcg.ev.filters), each kept to games with topics now; else all.
let VT = null;
const VT_PAGE = '/voices/';
const ATT = {positive:{l:'好意的',m:'＋'}, negative:{l:'否定的',m:'－'}, mixed:{l:'賛否両論',m:'±'}, neutral:{l:'中立',m:'・'}};
const VOLW = {high:3, mid:2, low:1};
const daysBetween = (a,b) => Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
let vtGame = {};
// the block stays hidden until the answer comes, and on any failure (nothing to retry: it is a teaser)
async function loadVt(){
  try{
    const r=await fetch(H.voicesApi,{headers:{accept:'application/json'}});
    const s=r.ok?(await r.json()).snapshot:null;
    if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!Array.isArray(s.topics)||!s.topics.every(t=>t&&typeof t.id==='string'&&typeof t.game==='string'&&typeof t.title==='string'&&typeof t.summary==='string')) return;
    const used=new Set(s.topics.map(t=>t.game));
    VT={date:s.date, topics:s.topics, games:(H.voiceGames||[]).filter(g=>used.has(g.code))};
    vtGame=Object.fromEntries(VT.games.map(g=>[g.code,g]));
    renderVt();
  }catch(e){}
}
const vtvars = c => { const g=vtGame[c]; return g&&g.c ? `--gl:${g.c};--gd:${g.cd}` : '--gl:hsl(220 62% 46%);--gd:hsl(220 60% 68%)'; };
function vtGames(){
  const codes=savedGames(c=>vtGame[c]);
  return VT.games.map(g=>g.code).filter(c=>codes.includes(c));
}
function renderVt(){
  if(!VT) return;
  const sec=$('vtr');
  // a snapshot older than a week is not "now": no block
  if(daysBetween(VT.date,TODAY)>7||!VT.topics.length){ sec.hidden=true; return; }
  sec.hidden=false;
  const sel=vtGames(), all=!sel.length;
  $('vtSub').textContent = all ? 'すべてのタイトル'
    : sel.slice(0,4).map(c=>vtGame[c].short||vtGame[c].name).join('・')+(sel.length>4?` ほか${sel.length-4}`:'')+' の話題';
  // busiest first, then newer first_seen; at most 2 per game unless one game is chosen
  const pool=VT.topics.map((t,i)=>({t,i})).filter(({t})=>all||sel.includes(t.game))
    .sort((a,b)=>(VOLW[b.t.volume]||0)-(VOLW[a.t.volume]||0)||(a.t.first_seen<b.t.first_seen?1:a.t.first_seen>b.t.first_seen?-1:0)||a.i-b.i);
  const cap=sel.length===1?5:2, per={}, rows=[];
  // 6 (two full rows of 3) when they sit on the left of a day without releases
  const max=$('wkPanel').querySelector('.rel0')&&$('wkPanel').querySelector('.evb')?6:5;
  for(const {t} of pool){ if(rows.length>=max) break; if((per[t.game]=(per[t.game]||0)+1)>cap) continue; rows.push(t); }
  const badge=t=>t.status==='continuing' ? `<span class="badge hot"><span aria-hidden="true">🔥 </span>${daysBetween(t.first_seen,VT.date)+1}日連続</span>`
    : t.status==='cooling' ? '<span class="badge cool"><span aria-hidden="true">📉 </span>落ち着き</span>'
    : t.status==='new' ? '<span class="badge new"><span aria-hidden="true">🆕 </span>新</span>' : '';
  $('vtBody').innerHTML = `<ul class="vts">${rows.map((t,i)=>{
    const g=vtGame[t.game]||{name:t.game,short:t.game}, a=ATT[t.attitude]||ATT.neutral, k=ATT[t.attitude]?t.attitude:'neutral';
    return `<li><div class="vt" style="${vtvars(t.game)}">`
      + `<span class="vh" id="vtM${i}">${gl(g.name,`${gi(g.name)}<span aria-hidden="true">${esc(g.short||g.name)}</span><span class="sr">${esc(g.name)}</span>`,'gm')}`
      + `<span class="am a-${k}"><span aria-hidden="true">${a.m}</span>${a.l}</span>${badge(t)}</span>`
      + `<a class="tt" id="vtT${i}" href="${VT_PAGE}#t=${encodeURIComponent(t.id)}" title="${esc(t.summary)}" aria-describedby="vtM${i}">${esc(t.title)}</a></div></li>`;
  }).join('')}</ul>`;
  const [,m,d]=VT.date.split('-').map(Number);
  $('vtAsOf').textContent=`${m}/${d} 時点・AI要約`;
}

function renderAll(){ renderSet(); renderWeek(); renderVt(); }
$('hDate').textContent = (([y,m,d])=>`${+m}月${+d}日(${DOW[dowOf(TODAY)]})`)(TODAY.split('-'));
readStars(); renderAll(); loadEvents();
if($('vtr')) loadVt();
document.addEventListener('click',e=>{
  const gt=e.target.closest('#evBody .gt');
  if(gt){ const o=gt.getAttribute('aria-expanded')!=='true', b=$(gt.getAttribute('aria-controls')); evOpen[gt.dataset.g]=o; gt.setAttribute('aria-expanded',o); if(b) b.hidden=!o; return; }
  if(e.target.closest('#evRetry')) loadEvents(true);
  else if(e.target.closest('#hsLocSet')) openLoc($('hsBtn'));
  else if(e.target.closest('#hsBtn')) openSet();
});
// the settings dialog: chips change a draft, この内容で表示 saves it; キャンセル / × / Esc / the backdrop drop it
$('hsDlg').addEventListener('click',e=>{
  const d=$('hsDlg');
  if(e.target===d||e.target.closest('#hsClose,#hsCancel')){ closeSet(); return; }
  if(e.target.closest('#hsOk')){ applySet(); closeSet(); $('hsBtn').focus(); return; }
  // the picker opens over this dialog and saves the location itself; the title draft stays pending
  if(e.target.closest('#hsLocBtn')){ openLoc($('hsLocBtn')); return; }
  const c=e.target.closest('[data-t]');
  if(!c) return;
  const t=c.dataset.t;
  draft = !t ? [] : draft.includes(t) ? draft.filter(x=>x!==t) : [...draft,t]; edited=true;
  renderSetDlg();
});
// logged in, corner.html replaces the local favourites / saved filters with the account's: re-read them
document.addEventListener('sn:prefs',()=>{
  readStars(); renderAll(); loadEvents(); if(LOC) LOC.refresh();
  if($('hsDlg').open){ if(!edited) draft=homeSel(); renderSetDlg(); }
});
})();
</script>

<title>トレカカレンダー</title>
<style>
@font-face{font-family:"Dela Gothic One";src:url("/fonts/dela-gothic-one.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Zen Kaku Gothic New";src:url("/fonts/zen-kaku-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Zen Kaku Gothic New";src:url("/fonts/zen-kaku-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("/fonts/jetbrains-mono.woff2") format("woff2");font-weight:100 800;font-display:swap}
/* Layout: logo row · sticky toolbar panel · release grid where busy weekdays get wide columns and quiet ones collapse to a slim rail; gold "foil" marks today */
:root{
  --bg:#eceef4; --surface:#ffffff; --surface-2:#f6f7fb; --ink:#161a2b; --muted:#646a80; --faint:#9aa0b4; --line:#dde0ea;
  --accent:#3a43d0; --accent-ink:#ffffff; --accent-soft:#e5e7fb;
  --foil:#e7a90e; --foil-hi:#ffd45c; --foil-soft:#fff4d1; --foil-ink:#3b2a00;
  --sat:#2d63c8; --sun:#cc3340;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  /* text that arrives from the API after the build (話題 topics): the subset fonts lack many of its kanji, so one system face, not a per-glyph mix */
  --runtime:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --chip-l:46%; --chip-s:62%; --tint-l:95%; --shadow:0 1px 2px rgb(22 26 43 / .06),0 4px 16px rgb(22 26 43 / .05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f111a; --surface:#181b27; --surface-2:#1d2130; --ink:#e8eaf3; --muted:#9ca2b8; --faint:#6b7189; --line:#2a2f42;
  --accent:#8f98ff; --accent-ink:#0f111a; --accent-soft:#252a4a;
  --foil:#f3bf3a; --foil-hi:#ffe08a; --foil-soft:#33290f; --foil-ink:#1a1300;
  --sat:#80a8ff; --sun:#ff7f88;
  --chip-l:68%; --chip-s:60%; --tint-l:19%; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f111a; --surface:#181b27; --surface-2:#1d2130; --ink:#e8eaf3; --muted:#9ca2b8; --faint:#6b7189; --line:#2a2f42;
  --accent:#8f98ff; --accent-ink:#0f111a; --accent-soft:#252a4a;
  --foil:#f3bf3a; --foil-hi:#ffe08a; --foil-soft:#33290f; --foil-ink:#1a1300;
  --sat:#80a8ff; --sun:#ff7f88;
  --chip-l:68%; --chip-s:60%; --tint-l:19%; --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5}
.wrap{max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:24px 56px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.brand{flex:none;margin:0;line-height:0;display:block}
.brand svg{height:56px;width:auto;display:block}
h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,38px);line-height:1;margin:0;letter-spacing:.01em}
h1 .y{font-family:var(--mono);font-size:.42em;color:var(--muted);vertical-align:middle;margin-left:10px;letter-spacing:0}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:8px;background:var(--bg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.month{display:flex;align-items:center;gap:4px}
.month b{font-family:var(--display);font-weight:400;font-size:20px;min-width:7em;text-align:center;font-variant-numeric:tabular-nums}
.ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;min-width:34px;padding:0 10px;font-weight:700;font-size:15px}
.ib:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.todaybtn{border:1px solid var(--foil);background:var(--foil-soft);color:var(--ink);border-radius:8px;height:34px;padding:0 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.todaybtn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--foil)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:0 12px;height:28px;border-radius:7px;font-weight:700;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.month b small{font-size:inherit;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.count{color:var(--muted);font-size:13px;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{font-family:var(--mono);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:40vh;overflow-y:auto;padding-top:10px;border-top:1px solid var(--line)}
/* Event games carry a fixed light/dark colour pair inline (--gl/--gd, palette in CLAUDE.md); release titles only a hue (--h). */
[style*="--gl"]{--g:var(--gl);--gt:color-mix(in oklab,var(--gl) 65%,#000);--gtint:color-mix(in oklab,var(--gl) 12%,var(--surface))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) [style*="--gl"]{--g:var(--gd);--gt:color-mix(in oklab,var(--gd) 60%,#fff);--gtint:color-mix(in oklab,var(--gd) 20%,var(--surface))}}
:root[data-theme="dark"] [style*="--gl"]{--g:var(--gd);--gt:color-mix(in oklab,var(--gd) 60%,#fff);--gtint:color-mix(in oklab,var(--gd) 20%,var(--surface))}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
/* game icon (gi() in build.py): official favicon on a light tile in both themes, or a monogram tile in the game colour, darkened for >=4.5:1 white text */
.gi{--gi:16px;flex:none;box-sizing:border-box;width:var(--gi);height:var(--gi);border-radius:4px;vertical-align:-3px}
span.gi{display:inline-grid;place-items:center;background:color-mix(in oklab,var(--gl,hsl(var(--h) 55% 42%)) 80%,#000);color:#fff;font-size:calc(var(--gi) * .64);font-weight:700;font-style:normal;line-height:1}
img.gi{display:inline-block;padding:1px;background:#fff;box-shadow:inset 0 0 0 1px rgb(0 0 0 / .14)}
.chip em{font-style:normal;color:var(--faint);font-family:var(--mono);font-size:12px}
.chip:hover{border-color:var(--faint)}
.chip[aria-pressed="true"]{border-color:var(--g,hsl(var(--h) var(--chip-s) var(--chip-l)));background:var(--gtint,hsl(var(--h) 70% var(--tint-l)));font-weight:700}
.chip[aria-pressed="true"] em{color:var(--muted)}
.chip.all[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.chip.all[aria-pressed="true"] em{color:inherit;opacity:.7}
.chip.toggle{border-style:dashed;color:var(--accent);font-weight:700}

/* calendar */
.cal{margin-top:8px;display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.dow{padding:8px 8px 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2);text-align:left}
.dow.slim{text-align:center;padding-inline:0}
.dow.sat{color:var(--sat)} .dow.sun{color:var(--sun)}
.dow.now{color:var(--foil-ink);background:var(--foil)}
.day{min-height:132px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}
.day.lastcol{border-right:0}
.day.slim{padding:8px 0;align-items:center;background:var(--surface-2)}
.day.out{background:var(--surface-2)}
.day.out .dn{opacity:.4}
.day.past .pk{opacity:.5}
.day.past .pk:hover{opacity:1}
.dn{display:flex;align-items:center;justify-content:space-between;gap:6px;font-family:var(--mono);font-size:13px;font-weight:700;line-height:1}
.dn .n{min-width:26px;height:26px;display:inline-grid;place-items:center;border-radius:50%}
.dn.sat .n{color:var(--sat)} .dn.sun .n{color:var(--sun)}
.dn .c{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:3px 8px}
.day.today{background:var(--foil-soft);box-shadow:inset 0 0 0 2px var(--foil)}
.day.today .dn .n{background:var(--foil);color:var(--foil-ink)}
.day.today .tbadge{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--foil-ink);background:var(--foil);border-radius:4px;padding:2px 5px}
.day.slim .dn{flex-direction:column;gap:4px}
.day.slim .tbadge{writing-mode:vertical-rl;letter-spacing:.2em;padding:5px 2px}
.pk{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:start;text-align:left;border:1px solid transparent;background:hsl(var(--h) 70% var(--tint-l));border-radius:8px;padding:5px 6px 5px 5px;position:relative}
.pk::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:hsl(var(--h) var(--chip-s) var(--chip-l))}
.pk:hover{border-color:hsl(var(--h) var(--chip-s) var(--chip-l))}
.th{width:40px;aspect-ratio:3/4;border-radius:4px;background:var(--surface-2);object-fit:cover;display:block;box-shadow:0 1px 2px rgb(0 0 0 / .15)}
.th.none{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%;color:hsl(var(--h) var(--chip-s) var(--chip-l));background:hsl(var(--h) 70% var(--tint-l));border:1px solid hsl(var(--h) 40% calc(var(--tint-l) - 8%));box-shadow:none;overflow:hidden}
.th.none svg{width:58%;height:auto;display:block}
.th.none small{display:none;font-size:11px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.pk .t{min-width:0;display:flex;flex-direction:column;gap:1px}
.pk .g .gi{--gi:14px;margin-right:3px}
.pk .g{font-size:12px;font-weight:700;color:hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 6%));line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk .n{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.pk .pr{font-family:var(--mono);font-size:12px;color:var(--muted)}
.more{border:1px dashed var(--line);border-radius:8px;background:none;color:var(--accent);font-size:12px;font-weight:700;padding:5px}
.more:hover{border-color:var(--accent)}

/* agenda for narrow screens */
.agenda{display:none;margin-top:8px;flex-direction:column;gap:12px}
.ag{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.ag.past{opacity:.6}
.ag.today{border-color:var(--foil);background:var(--foil-soft)}
.ag h3{margin:0 0 8px;font-size:16px;font-family:var(--display);font-weight:400;display:flex;gap:8px;align-items:center}
.ag h3 span{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:700}
.ag h3 .tbadge{font-family:var(--body);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--foil-ink);background:var(--foil);border-radius:4px;padding:2px 6px}
.ag .list{display:grid;gap:6px}
.ag .pk{grid-template-columns:48px minmax(0,1fr)}
.ag .th{width:48px}
.ag .n{font-size:14px}
.todayline{display:flex;align-items:center;gap:10px;color:var(--foil-ink);font-weight:700;font-size:12px}
.todayline::before,.todayline::after{content:"";flex:1;height:2px;background:var(--foil)}
.todayline span{background:var(--foil);padding:3px 10px;border-radius:999px}

/* table */
.tablewrap{margin-top:8px;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{background:var(--surface-2);font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700;cursor:pointer;user-select:none;white-space:nowrap}
thead th.nosort{cursor:default}
thead th[aria-sort="ascending"]::after{content:" ▲"} thead th[aria-sort="descending"]::after{content:" ▼"}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.past td{color:var(--muted)}
tbody tr.past .th{opacity:.6}
tbody tr.istoday td{background:var(--foil-soft)}
tr.tl td{padding:0;border-bottom:0}
tr.tl td div{display:flex;align-items:center;gap:10px;padding:6px 12px;color:var(--foil-ink);font-weight:700;font-size:12px}
tr.tl td div::after{content:"";flex:1;height:2px;background:var(--foil)}
tr.tl td span{background:var(--foil);padding:2px 10px;border-radius:999px}
td.d{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
td.p{font-family:var(--mono);font-size:12.5px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.p .pb{display:block;font-size:12px;color:var(--muted)}
td .th{width:40px}
td.nm{min-width:260px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap}
td.lk{white-space:nowrap;font-size:12.5px}
td.lk a{color:var(--accent);font-weight:700;text-decoration:none}
td.lk a:hover{text-decoration:underline}
.ap{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.thbtn{background:none;border:0;padding:0}

/* detail dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgb(0 0 0 / .3)}
dialog::backdrop{background:rgb(10 12 20 / .5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg .close{position:absolute;right:12px;top:12px}
.dl-day{font-family:var(--display);font-weight:400;font-size:22px;margin:0;padding-right:44px}
.dl-item{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:start;padding-top:14px;border-top:1px solid var(--line)}
.dl-item .th{width:104px;border-radius:6px}
.dl-item .th.none small,.cal-item .th.none small{display:block}
.dl-item h4{margin:4px 0 8px;font-size:15px;line-height:1.45}
.dl-item dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
.dl-item dt{color:var(--muted)} .dl-item dd{margin:0;font-family:var(--mono);font-size:12.5px}
.dl-links{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.dl-links a{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.dl-links a:hover{border-color:var(--accent)}
.legend{margin:16px 2px 0;font-size:12px;color:var(--muted);max-width:80ch}
.dl-none{margin:4px 0 0;font-size:13px;color:var(--muted)}
.legend a{color:inherit}

.filters{display:flex;align-items:flex-start;gap:12px;padding-top:10px;border-top:1px solid var(--line)}
.filters>.row{order:2;flex:none;min-height:28px}
.filters .chips{flex:1 1 0;min-width:0;border-top:0;padding-top:0}
.filterbtn{display:none;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;padding:0 10px;font-weight:700;font-size:13px}
.starbtn{display:none;position:relative;place-items:center;width:32px;height:32px;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--muted);font-size:16px;line-height:1}
.starbtn[aria-pressed="true"]{border-color:var(--foil);background:var(--foil);color:var(--foil-ink)}
.starbtn em{position:absolute;top:-6px;right:-6px;font-style:normal;font-family:var(--mono);font-size:12px;background:var(--foil);color:var(--foil-ink);border:2px solid var(--surface);border-radius:999px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 3px}
.starbtn[aria-pressed="true"] em{background:var(--ink);color:var(--surface)}
.filterbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.filterbtn em{font-style:normal;font-family:var(--mono);font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
#sortSel{display:none;font:inherit;font-size:13px;color:inherit;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 8px}
.daytoggle{display:flex;align-items:center;gap:10px;width:100%;border:1px dashed var(--line);background:none;border-radius:8px;padding:6px 10px 6px 6px;color:var(--accent);font-weight:700;font-size:12.5px;text-align:left}
.daytoggle:hover{border-color:var(--accent)}
.daytoggle.mini{display:block;width:auto;margin-top:8px;padding:4px 2px;border:0;background:none;font-family:var(--body);font-size:12px;line-height:1.3;text-decoration:underline;text-underline-offset:3px}
.daytoggle .peek{display:flex;flex:none}
.daytoggle .peek>span{margin-left:-8px;display:block}
.daytoggle .peek>span:first-child{margin-left:0}
.daytoggle .peek .th{width:24px;border:2px solid var(--surface);box-shadow:none}
.ag .daytoggle .th{width:24px}
.daytoggle .peek .th.none{font-size:8px}
.daytoggle .lbl{flex:1;min-width:0}
.pastbtn{width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:10px;color:var(--muted);font-weight:700;font-size:13px}

/* corner (src/corner.html): settings and user at the right end of the logo row; the tool tabs sit after the logo */
.corner{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.cmenu{position:relative;display:flex}
.cmenu[hidden]{display:none}
.cbtn{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--muted)}
.cbtn:hover,.cbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.cpop{position:absolute;right:0;top:calc(100% + 6px);z-index:40;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgb(0 0 0 / .18);padding:8px;display:grid;gap:2px}
.cpop-h{margin:2px 6px 6px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.cpop-user{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);letter-spacing:0;padding-bottom:8px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.mi{display:block;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700}
.mi:hover{background:var(--surface-2)}
a.mi{color:var(--ink);text-decoration:none}
.cpop-sep{border:0;border-top:1px solid var(--line);margin:8px 0 4px}
.themeseg{display:flex}
.themeseg button{flex:1;justify-content:center}
.themeseg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.loginbtn{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.loginbtn:hover{filter:brightness(1.1)}
.cbtn.avatar{border-radius:50%;overflow:hidden}
.av{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;border-radius:50%}
.av.ini{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px}
.av.sm{width:26px;height:26px;flex:none;font-size:12px}
.acctdlg{width:min(440px,calc(100vw - 32px))}
.acct-sec{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.acct-sec h3{margin:0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.acct-sec>div{display:flex}
.acct-who{align-items:center;gap:10px}
.acct-who .av{width:40px;height:40px;flex:none}
.acct-who b{display:block;font-size:14px}
.acct-who small{display:block;font-size:11.5px;color:var(--muted)}
.acct-note{margin:0;font-size:12px;color:var(--muted)}
.acct-note a{color:var(--accent)}
.acct-msg{margin:0;font-size:12.5px;color:var(--sun);font-weight:700}
.acct-msg:empty{display:none}
.sbtn:disabled{opacity:.4;cursor:default}

/* star / favourites */
.pkw{position:relative}
.pkw .pk{width:100%}
.pkw{border:1px solid transparent;border-radius:9px}
.pkw.on{border-color:var(--foil)}
.pkw .pk,.pkw.on .pk{border:0;padding-right:40px}
.star{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:4px;border-radius:6px;display:inline-flex;align-items:center;gap:6px}
.star:hover{color:var(--foil)}
.star.on{color:var(--foil)}
.pkw>.star{position:absolute;top:0;right:0;bottom:0;width:34px;justify-content:center;padding:0;font-size:18px;border-left:1px solid var(--line);border-radius:0 8px 8px 0}
.pkw>.star:hover{background:var(--foil-soft)}
.pkw.on>.star{border-left-color:var(--foil);background:var(--foil-soft)}
.star.big{border:1px solid var(--line);font-size:15px;padding:4px 10px;border-radius:999px}
.star.big span{font-size:12px;font-weight:700;color:var(--ink)}
.star.big.on{border-color:var(--foil);background:var(--foil-soft)}
.dl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chip.starchip{color:var(--ink)}
.chip.starchip[aria-pressed="true"]{border-color:var(--foil);background:var(--foil);color:var(--foil-ink);font-weight:700}
.chip.starchip[aria-pressed="true"] em{color:inherit;opacity:.75}
td.sc{width:36px;padding-right:0}
tbody tr.starred td.nm{font-weight:700}
.mnote{margin:8px 2px 0;font-size:12.5px;color:var(--muted)}
.nextbtn{border:0;background:none;padding:0;font-size:inherit;font-weight:700;color:var(--accent)}
.nextbtn:hover{text-decoration:underline}
#calView{scroll-margin-top:130px}
.starbar{margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;background:var(--foil-soft);border:1px solid var(--foil);border-radius:14px;padding:10px 14px}
.sb-main{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-size:13px;color:var(--muted)}
.sb-main b{font-size:15px;color:var(--ink)}
.sb-sum{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.sb-act{display:flex;gap:8px}
.sbtn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--foil);background:var(--foil);color:var(--foil-ink);font-weight:700;font-size:12.5px}
.sbtn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.sbtn.warn{background:var(--sun);border-color:var(--sun);color:#fff}

.caldlg{width:min(460px,calc(100vw - 32px))}
.cal-item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.cal-item .th{width:64px}
.cal-item b{display:block;font-size:14px;line-height:1.4;margin:4px 0 2px}
.cal-date{font-family:var(--mono);font-size:12px;color:var(--muted)}
.cal-sub{margin:0;color:var(--muted);font-size:13px}
.calopts{display:grid;gap:8px}
.calopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;color:var(--ink);text-decoration:none}
.calopt:hover{border-color:var(--accent)}
.calopt b{display:block;font-size:14px}
.calopt small{display:block;font-size:11.5px;color:var(--muted)}
.calopt .ci{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-size:16px}
.cal-g summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:13px}
.cal-g ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:12.5px;max-height:30vh;overflow:auto}
.cal-g a{color:var(--accent)}
.cal-off{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.cal-foot{display:flex;justify-content:flex-end}
.calbtn{font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--foil-soft);border:1px solid var(--foil);border-radius:999px;padding:4px 10px}

.pageinfo{margin-top:28px}
.ptitle{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.ptitle h1{margin:0;font-family:var(--body);font-size:14px;font-weight:700;line-height:1.5;color:var(--muted);text-wrap:balance}
.ptitle p{margin:0;font-size:12px;color:var(--faint)}
.crumbs{font-size:12px;color:var(--faint);margin:0 0 2px}
.crumbs a{color:inherit}
.seo{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.seo h2{margin:0 0 4px;font-size:16px}
.seo>p,.seo-fold>p{margin:0 0 12px;font-size:12.5px;color:var(--muted)}
.seo-list{position:relative;padding-top:6px;padding-bottom:6px}
.seo-list>h2{display:flex;align-items:center;flex-wrap:wrap;min-height:40px;margin:0;padding-right:118px;font-size:14px;line-height:1.4}
.seo-list>h2 .ct{font-weight:400;font-size:13px;color:var(--muted)}
.seo-fold>summary{position:absolute;top:6px;right:12px;display:flex;align-items:center;gap:7px;min-height:40px;padding:0 6px;cursor:pointer;list-style:none;border-radius:8px;font-size:13px;font-weight:700;color:var(--accent)}
.seo-fold>summary::-webkit-details-marker{display:none}
.seo-fold>summary::before{content:'';flex:none;width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.seo-fold[open]>summary::before{transform:translateY(2px) rotate(-135deg)}
.seo-fold>summary:hover{text-decoration:underline}
.seo-fold:not([open]) .sc,.seo-fold[open] .so{display:none}
.seo-fold[open]{padding:4px 0 10px}
.seo-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px 20px}
.seo-day h3{margin:0 0 4px;font-family:var(--mono);font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:3px}
.seo-day ul{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.seo-day li{font-size:13px;line-height:1.45}
.seo-day li a{color:var(--ink);text-decoration:none}
.seo-day li a:hover{color:var(--accent);text-decoration:underline}
.seo-day .sg{font-size:12px;font-weight:700;color:var(--accent);margin-right:6px;text-decoration:none}
.about p{margin:0 0 8px;font-size:13px;line-height:1.75;color:var(--ink);max-width:80ch}
.about p:last-child{margin-bottom:0}
.about a{color:var(--accent)}
.seo-day .sp{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px;white-space:nowrap}
.sitenav{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:10px;font-size:12.5px}
.sitenav div{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.sitenav b{color:var(--muted);font-size:12px;letter-spacing:.06em;min-width:5em}
.sitenav a{color:var(--accent);text-decoration:none}
.sitenav a:hover{text-decoration:underline}
.sitenav a[aria-current]{color:var(--ink);font-weight:700}
.sitenav .sitenote{margin:0;font-size:12px;color:var(--muted)}

/* hub mode (title pages): game switcher, 話題 markers and topics (docs/design/game-hub.md) */
.gsw{display:inline-flex;align-items:center;gap:6px;flex:none;max-width:16em;border:1px solid var(--line);background:var(--surface);border-radius:8px;height:34px;padding:0 10px 0 8px;font-weight:700;font-size:14px}
.gsw:hover{border-color:var(--accent)}
.gsw .gn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gsw .cv{color:var(--muted);font-size:11px}
.swlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.swlist a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:13.5px}
.swlist a:hover{border-color:var(--accent)}
.swlist a[aria-current]{border-color:var(--ink);background:var(--surface-2)}
.dn button.n{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer}
.dn button.n:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.day,.dow{grid-row:var(--r)}
/* topic bars over their days (as /voices/ with one game): lane l sits at 40px + l*26px from the top of its week */
.tbar{position:relative;z-index:1;align-self:start;min-width:0;height:22px;margin:calc(40px + var(--l) * 26px) 5px 0;display:flex;align-items:center;gap:5px;padding:0 8px 0 6px;border-left:3px solid var(--g);border-radius:6px;background:var(--gtint);font-size:12px;line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-decoration:none}
.tbar:hover{box-shadow:inset 0 0 0 1px var(--g)}
.tbar.cl{margin-left:0;border-radius:0 6px 6px 0;border-left-style:dotted}
.tbar.cr{margin-right:0;border-top-right-radius:0;border-bottom-right-radius:0}
.tbar b,.tlr b{flex:none;color:var(--gt)}
.tbar .tt{min-width:0;overflow:hidden;text-overflow:ellipsis}
/* topic text comes from the API after the build: the system face (--runtime), as on /voices/ */
.tbar .tt,.tlr .tt,.tp a,.tp p{font-family:var(--runtime)}
.tlanes{flex:none;display:block}
.tmore{align-self:flex-start;border:0;background:none;padding:0;font:inherit;font-size:11px;font-weight:700;color:var(--accent);cursor:pointer}
/* per-type event counts (M2): a line at the foot of the cell, the location under the toolbar */
.evc{display:flex;flex-wrap:wrap;gap:0 8px;margin:auto 0 0;padding-top:4px;border-top:1px dashed var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
/* a "type N" pair breaks only when it alone is wider than the cell */
.evc span{max-width:100%;word-break:keep-all;overflow-wrap:anywhere}
.evc b{font-family:var(--mono);color:var(--ink)}
.agn{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted 2px;text-underline-offset:4px;cursor:pointer}
.evag{align-self:flex-start;justify-self:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--accent)}
.locline{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.dl-ev{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.dl-ev h3{margin:0 0 8px;font-size:15px}
.dl-ev ul{margin:0 0 10px;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px;font-size:13px}
.dl-ev ul b{font-family:var(--mono)}
.dl-ev a{color:var(--accent);font-weight:700;font-size:13px}
/* phones: the month's topics as a compact timeline above the day list */
.tline{display:none}
.tps{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tp{border-left:3px solid var(--g);padding:1px 0 1px 10px;min-width:0}
.tp a{font-weight:700;font-size:14px;color:var(--ink);text-decoration:none}
.tp a:hover{color:var(--accent);text-decoration:underline}
.tp p{margin:2px 0 0;font-size:13px;line-height:1.6}
.tp small{display:block;margin-top:2px;font-size:12px;color:var(--muted)}
.tp .tb{margin-left:6px;font-size:12px;font-weight:700;color:var(--gt);white-space:nowrap}
.dl-tp{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.dl-tp h3{margin:0 0 8px;font-size:15px}
.hubtp h2{margin-bottom:10px}
/* いま話題 as cards (the home block's grid, without its game chip: the hub is one game): as many 240px+ columns as fit */
.hubtp{--pos:#1d7f4c;--mix:#94580a;--neg:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hubtp{--pos:#5fd39a;--mix:#f0b44c}}
:root[data-theme="dark"] .hubtp{--pos:#5fd39a;--mix:#f0b44c}
.hubtp .a-positive{--a:var(--pos)} .hubtp .a-negative{--a:var(--neg)} .hubtp .a-mixed{--a:var(--mix)} .hubtp .a-neutral{--a:var(--muted)}
.vts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));gap:10px}
.vts>li{display:flex;min-width:0}
.vt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-top:3px solid var(--g);border-radius:10px;padding:9px 12px 10px;color:var(--ink);text-decoration:none}
.vt:hover{border-color:var(--accent);border-top-color:var(--g)}
.vt:hover .tt{color:var(--accent);text-decoration:underline}
.vt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vt .vh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;font-weight:700}
.vt .am{color:var(--a);white-space:nowrap}
.vt .badge{margin-left:auto;font-size:12px;font-weight:700;border-radius:4px;padding:0 6px;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.vt .badge.new{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.vt .badge.hot{border-color:var(--foil);background:var(--foil-soft);color:var(--ink)}
.vt .badge.cool{color:var(--muted)}
.vt .tt,.vt .sm{font-family:var(--runtime);overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.vt .tt{font-size:14px;font-weight:700;line-height:1.45;-webkit-line-clamp:2}
.vt .sm{font-size:12.5px;line-height:1.6;color:var(--ink);-webkit-line-clamp:3}
.vt .tr{margin-top:auto;padding-top:6px;border-top:1px dashed var(--line);font-size:12px;color:var(--muted)}
.tp-f{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;margin:12px 0 0;font-size:12px;color:var(--muted)}
.tp-f a{color:var(--accent);font-weight:700;text-decoration:none}
.tp-f a:hover{text-decoration:underline}

/* location button (/ and /events/: opens the shared picker, src/locpick.html) */
.locbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:3px 10px 3px 8px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.locbtn svg{color:var(--accent);flex:none}
.locbtn small{font-size:12px;color:var(--accent)}
.locbtn:hover{border-color:var(--accent)}
/* tool tabs: next to the logo on desktop, a bar fixed to the bottom of the screen on phones */
.tooltabs{display:inline-flex;flex:none;gap:2px;padding:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px}
.tooltabs a{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:28px;padding:0 12px;border-radius:7px;font-weight:700;font-size:13px;color:var(--muted);text-decoration:none;white-space:nowrap}
.tooltabs a:hover{color:var(--accent);background:var(--surface-2)}
.tooltabs a[aria-current]{background:var(--accent);color:var(--accent-ink)}
.tooltabs svg{width:16px;height:16px;flex:none}
.panel>.row{flex-wrap:nowrap}
@media (max-width:900px){.tooltabs a{padding:0 10px}}
/* three tabs do not fit next to the logo on narrow tablets: short names there (the aria-label keeps the full one) */
@media (min-width:761px) and (max-width:900px){.tooltabs:has(a:nth-child(3)) .tl2{display:none}}
@media (max-width:900px){.seg button{padding:0 9px}.seg button span{display:none}}

@media (max-width:760px){
  .wrap{padding-block:16px 40px}
  header.top{gap:10px;margin-bottom:4px}
  .brand svg{height:38px}
  .ptitle h1{font-size:13px}
  .seo{padding:14px 12px}
  .seo-list{padding-top:4px;padding-bottom:4px}
  .seo-fold>summary{top:4px;right:6px}
  .seo-list>h2{padding-right:112px}
  .seo-days{grid-template-columns:1fr}
  .cbtn{height:32px;width:32px}
  .corner{gap:6px}
  .loginbtn{height:32px;width:32px;padding:0;justify-content:center}
  .loginbtn span{display:none}
  .starbtn{display:inline-grid}
  .panel>.row{gap:4px}
  .seg button{padding:0 6px}
  .month .ib{min-width:26px;width:26px;padding:0}
  .gsw{height:32px;padding:0 5px;gap:3px;font-size:12.5px;max-width:6.5em}
  .todaybtn{padding:0 7px;white-space:nowrap;flex:none}
  .seg{padding:0;background:var(--surface)}
  .seg button{padding:0;width:30px;height:30px;justify-content:center;color:var(--ink)}
  .seg button[aria-pressed="true"]{display:none}
  .month b{min-width:0}
  .starbtn{width:30px;flex:none}
  .filterbtn{flex:none;justify-content:center}
  .starbar{padding:10px 12px;border-radius:12px}
  .sb-act{width:100%;flex-wrap:wrap}
  #calStars{flex-basis:100%}
  .sbtn{flex:1}

  .bar{padding-block:6px;margin-inline:-16px;padding-inline:16px}
  .panel{padding:8px;border-radius:12px;gap:8px}
  .panel>.row{flex-wrap:nowrap;gap:6px}
  .month{gap:2px}
  .month b{min-width:0;padding:0 2px;white-space:nowrap}
  .ib{height:32px;min-width:30px;padding:0 6px}
  .todaybtn{height:32px;padding:0 9px}
  .todaybtn::before{display:none}
  .seg{flex:none}
  .seg button{padding:0 8px;height:26px}
  .seg button span{display:none}
  .month b small{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);line-height:1;margin-bottom:1px}
  .month b{line-height:1;font-size:17px;min-width:3.2em}
  .filterbtn{display:inline-flex;height:32px;padding:0 8px;gap:4px;font-size:12px;white-space:nowrap}
  .filters{display:none;flex-direction:column;align-items:stretch;padding-top:8px}
  .filters>.row{order:0}
  .filters .chips{flex:none}
  .bar.open .filters{display:flex}
  .filters .row{gap:8px}
  .count{margin-left:0}
  .chips{border-top:0;padding-top:0;max-height:34vh}
  .viewtabs{display:flex}

  .cal{display:none}
  .agenda{display:flex;gap:10px}
  .tline{display:grid;gap:8px;margin-top:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .tline h3{margin:0;font-size:12px;font-weight:700;color:var(--muted)}
  .tlr{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:3px 8px;color:var(--ink);text-decoration:none;font-size:13px}
  .tlr .tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
  .tlr .td{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .tlr .tk{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:var(--surface-2)}
  .tlr .tk i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--g)}
  .ag{scroll-margin-top:76px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 10px 10px 8px;border-radius:12px}
  .ag h3{flex-direction:column;align-items:center;gap:2px;margin:0;font-size:22px;line-height:1;position:sticky;top:64px;align-self:start}
  .ag h3 .dw{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted)}
  .ag h3 .dw.sat{color:var(--sat)} .ag h3 .dw.sun{color:var(--sun)}
  .ag h3 .ct{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:4px}
  .ag h3 .tbadge{font-size:9px;padding:2px 4px;margin-top:4px}
  .ag .list{gap:6px}
  .ag .pk{grid-template-columns:52px minmax(0,1fr);background:var(--surface-2);padding:6px 8px 6px 6px;gap:10px}
  .ag .pk::before{top:8px;bottom:8px}
  .ag .th{width:52px}
  .ag .n{font-size:14px;-webkit-line-clamp:3}
  .ag .pr{font-size:12px}
  .ag .pkw .pk{padding-right:52px}
  .ag .pkw>.star{width:46px;font-size:22px}
  .ag .pkw>.star:active{background:var(--foil-soft)}

  .tablewrap{border:0;background:none;box-shadow:none;overflow:visible}
  table,tbody{display:block;min-width:0}
  thead{display:none}

<script>
const DATA = /*DATA*/;
const OFFICIAL = /*OFFICIAL*/;
const PAGE = /*PAGE*/null;
/*GICON*/
const DOW = ['日','月','火','水','木','金','土'];
const keyOf = dt => dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
// hubs show Japanese events and topics: their today is Tokyo's (/releases/ keeps the browser's)
const TODAY = PAGE&&PAGE.hub ? new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()) : keyOf(new Date());
const num = s => { const m=(s||'').replace(/,/g,'').match(/\d+/); return m?+m[0]:null };
DATA.forEach(d=>{d.packN=num(d.pack); d.boxN=num(d.box)});

const counts = {}; DATA.forEach(d=>counts[d.game]=(counts[d.game]||0)+1);
const games = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b,'ja'));
const DEFAULT_CHIPS = ['MTG','ヴァイスシュヴァルツ','ポケモンカード','UNION ARENA','ONE PIECE'].filter(g=>counts[g]);
const chipOrder = [...DEFAULT_CHIPS, ...games.filter(g=>!DEFAULT_CHIPS.includes(g))];
const HUE = {}; games.forEach((g,i)=>HUE[g]=Math.round((i*137.508+230)%360));

try{localStorage.removeItem('tcg.q')}catch(e){}
const store = { get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };
const months = [...new Set(DATA.map(d=>d.date.slice(0,7)))].sort();
const curMonth = TODAY.slice(0,7);
const homeMonth = months.includes(curMonth) ? curMonth : (months.find(m=>m>curMonth) || months[months.length-1]);
// A title page whose title has nothing this month opens on its nearest month with releases: the next one, else the latest.
const pageMonths = PAGE&&PAGE.game ? [...new Set(DATA.filter(d=>d.game===PAGE.game).map(d=>d.date.slice(0,7)))].sort() : [];
const pageHome = pageMonths.length && !pageMonths.includes(curMonth) ? (pageMonths.find(m=>m>curMonth) || pageMonths[pageMonths.length-1]) : null;
const CHIP_LIMIT = 5;
// hub mode (title pages, docs/design/game-hub.md): PAGE.hub, the other hubs for the switcher, PAGE.voicesApi for 話題.
// ?m=YYYY-MM is the shown month (kept in the URL, carried by the switcher).
const HUB = PAGE&&PAGE.hub || null;
const hubDefault = pageHome || homeMonth;
const hubM = HUB ? new URLSearchParams(location.search).get('m') : null;
const state = {
  view: store.get('tcg.view','cal'),
  sel: PAGE&&PAGE.game ? new Set([PAGE.game]) : new Set(store.get('tcg.sel',[]).filter(g=>counts[g])),
  month: PAGE&&PAGE.month&&months.includes(PAGE.month) ? PAGE.month : hubM&&months.includes(hubM) ? hubM : pageHome || homeMonth,
  sort: {k:'date',dir:1},
  chipsOpen: !!store.get('tcg.chipsOpen',false),
  showPast: false,
  starOnly: !!store.get('tcg.starOnly',false),
  openDays: new Set()
};

const track = (name, params) => { try { if (window.gtag) window.gtag('event', name, params || {}); } catch (e) {} };
const starKey = d => d.id;
// favourites used to be stored as "date|name"; map those to ids once, keep anything unknown as is
const stars = new Set(store.get('tcg.stars',[]).map(k=>{
  if(!String(k).includes('|')) return k;
  const d=DATA.find(x=>x.date+'|'+x.name===k); return d?d.id:k;
}));
store.set('tcg.stars',[...stars]);
// logged in, corner.html syncs tcg.stars / tcg.calAskOff with the account: tell it about changes, re-read its updates
const synced = () => { if(window.snPrefs) window.snPrefs.changed(); };
document.addEventListener('sn:prefs',()=>{
  const next=store.get('tcg.stars',[]);
  if(next.length===stars.size && next.every(k=>stars.has(k))) return;
  stars.clear(); next.forEach(k=>stars.add(k));
  if(state.starOnly && !stars.size){ state.starOnly=false; store.set('tcg.starOnly',false); }
  render();
  if(dlg.open && dlgItems) openDetail(dlgItems,dlgTitle,true,dlgDay);
});
const isStar = d => stars.has(starKey(d));
const starFirst = (a,b) => (isStar(b)-isStar(a));
const starBtn = (d,big) => `<button class="star${isStar(d)?' on':''}${big?' big':''}" data-star-id="${d.id}" aria-pressed="${isStar(d)}" aria-label="${isStar(d)?'お気に入りから外す':'お気に入りに追加'}">${isStar(d)?'★':'☆'}${big?`<span>${isStar(d)?'お気に入り済み':'お気に入りに追加'}</span>`:''}</button>`;
function toggleStar(id){
  const d=DATA.find(x=>x.id===id); if(!d) return;
  const k=starKey(d); stars.has(k)?stars.delete(k):stars.add(k);
  store.set('tcg.stars',[...stars]); synced();
  track('favorite', {action: stars.has(k)?'add':'remove', game: d.game, item_name: d.name});
  if(state.starOnly && !stars.size){ state.starOnly=false; store.set('tcg.starOnly',false); }
  render();
  if(dlg.open && dlgItems) openDetail(dlgItems,dlgTitle,true,dlgDay);
  if(stars.has(k) && d.date>=TODAY && !store.get('tcg.calAskOff',false)) openCalPrompt([d],true);
}
const yen = n => '¥'+n.toLocaleString('ja-JP');
function renderStarbar(){
  const el=document.getElementById('starbar');
  if(!state.starOnly){ el.hidden=true; return; }
  const list=filtered().sort((a,b)=>a.date.localeCompare(b.date));
  const up=list.filter(d=>d.date>=TODAY);
  const sumPack=up.reduce((t,d)=>t+(d.packN||0),0), sumBox=up.reduce((t,d)=>t+(d.boxN||d.packN||0),0);
  el.hidden=false;
  el.innerHTML = list.length ? `<div class="sb-main"><b>★ お気に入り ${list.length}件</b><span>これから発売 ${up.length}件</span>
      <span class="sb-sum">1個ずつ ${yen(sumPack)}</span><span class="sb-sum">BOXで揃える ${yen(sumBox)}</span></div>
    <div class="sb-act">${up.length?`<button class="sbtn" id="calStars">📅 まとめてカレンダーに追加</button>`:''}<button class="sbtn ghost" id="copyStars">一覧をコピー</button><button class="sbtn ghost" id="clearStars">すべて解除</button></div>`
    : `<div class="sb-main"><b>★ お気に入りはまだありません</b><span>商品の ☆ を押すと、ここにまとめて表示されます。</span></div>`;
}
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PLACEHOLDER = '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M4 8L9.6 3 15.2 8 20.8 3 26.4 8 32 3 37.6 8 43.2 3 48.8 8 54.4 3 60 8V56L54.4 61 48.8 56 43.2 61 37.6 56 32 61 26.4 56 20.8 61 15.2 56 9.6 61 4 56Z" fill="currentColor" opacity=".22"/><path d="M32 11L38.4 25.6 53 32 38.4 38.4 32 53 25.6 38.4 11 32 25.6 25.6z" fill="currentColor"/></svg>';
const thumb = d => d.thumb ? `<img class="th" src="${esc(d.thumb)}" alt="${esc(d.game+' '+d.name)}" loading="lazy">` : `<span class="th none" role="img" aria-label="${esc(d.name)}（画像準備中）">${PLACEHOLDER}<small>画像準備中</small></span>`;
const fmtDate = (s,withYear=true) => { const [y,m,d]=s.split('-').map(Number); const w=new Date(y,m-1,d).getDay(); return `${withYear?y+'/':''}${m}/${d}(${DOW[w]})` };
const linkList = d => {
  const out=[];
  if(d.url) out.push(`<a href="${esc(d.url)}" target="_blank" rel="noopener">公式商品ページ ↗</a>`);
  if(OFFICIAL[d.game]) out.push(`<a href="${esc(OFFICIAL[d.game])}" target="_blank" rel="noopener">${esc(d.game)} 公式サイト ↗</a>`);
  return out;
};

function filtered(){
  return DATA.filter(d=>(!state.sel.size||state.sel.has(d.game)) && (!state.starOnly||isStar(d)));
}

// The calendar, and every view of a month page, show one month: chip counts and the N 件 count are that month's.
const monthScoped = () => state.view==='cal' || !!(PAGE&&PAGE.month);
function renderChips(){
  const el=document.getElementById('chips');
  if(HUB){ el.innerHTML=`<button class="chip starchip" aria-pressed="${state.starOnly}" data-star="1">★ お気に入り <em>${stars.size}</em></button>`; return; }
  const shown = state.chipsOpen ? chipOrder : chipOrder.filter(g=>DEFAULT_CHIPS.includes(g)||state.sel.has(g));
  const hiddenN = games.length-shown.length;
  const scope = monthScoped() ? DATA.filter(d=>d.date.startsWith(state.month)) : DATA, cn={};
  scope.forEach(d=>cn[d.game]=(cn[d.game]||0)+1);
  el.innerHTML = `<button class="chip all" aria-pressed="${!state.sel.size&&!state.starOnly}" data-g="">すべて <em>${scope.length}</em></button>` +
    `<button class="chip starchip" aria-pressed="${state.starOnly}" data-star="1">★ お気に入り <em>${stars.size}</em></button>` +
    shown.map(g=>`<button class="chip" style="--h:${HUE[g]}" aria-pressed="${state.sel.has(g)}" data-g="${esc(g)}">${gi(g)}${esc(g)} <em>${cn[g]||0}</em></button>`).join('') +
    (state.chipsOpen ? `<button class="chip toggle" data-toggle="1">閉じる ▲</button>`
      : hiddenN ? `<button class="chip toggle" data-toggle="1">ほか${hiddenN}タイトル ▼</button>` : '');
}
document.getElementById('chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  if(b.dataset.toggle){ state.chipsOpen=!state.chipsOpen; store.set('tcg.chipsOpen',state.chipsOpen); renderChips(); return; }
  const g=b.dataset.g;
  if(b.dataset.star){ state.starOnly=!state.starOnly; store.set('tcg.starOnly',state.starOnly); track('filter_favorites',{on:state.starOnly}); render(); return; }
  if(!g){ state.sel.clear(); state.starOnly=false; store.set('tcg.starOnly',false); } else state.sel.has(g)?state.sel.delete(g):state.sel.add(g);
  store.set('tcg.sel',[...state.sel]); if(g) track('filter_game',{game:g, on:state.sel.has(g)}); render();
});

function pkBtn(d){
  const pr=d.pack?`<span class="pr">${esc(d.pack)}${d.box&&d.box!==d.pack?` · BOX ${esc(d.box)}${d.per_box?`（${d.per_box}パック）`:''}`:''}</span>`:'';
  return `<div class="pkw${isStar(d)?' on':''}"><button class="pk" style="--h:${HUE[d.game]}" data-id="${d.id}" title="${esc(d.game+' / '+d.name)}">${thumb(d)}<span class="t"><span class="g">${gi(d.game)}${esc(d.game)}</span><span class="n">${esc(d.name)}</span>${pr}</span></button>${starBtn(d)}</div>`;
}


const DAY_PEEK = 1;
function dayList(k,its){
  const peekN=Math.max(DAY_PEEK, its.filter(isStar).length);
  if(its.length<=peekN) return its.map(pkBtn).join('');
  if(state.openDays.has(k)) return its.map(pkBtn).join('')+`<button class="daytoggle" data-day="${k}" aria-expanded="true"><span class="lbl">閉じる ▲</span></button>`;
  const rest=its.slice(peekN);
  return its.slice(0,peekN).map(pkBtn).join('')+`<button class="daytoggle" data-day="${k}" aria-expanded="false"><span class="peek">${rest.slice(0,5).map(d=>`<span style="--h:${HUE[d.game]}">${thumb(d)}</span>`).join('')}</span><span class="lbl">ほか${rest.length}件を表示 ▼</span></button>`;
}
const PER_DAY = 3;
function renderCal(list){
  const [y,m]=state.month.split('-').map(Number);
  const first=new Date(y,m-1,1), start=new Date(y,m-1,1-first.getDay());
  const last=new Date(y,m,0);
  const weeks=Math.ceil((first.getDay()+last.getDate())/7);
  const byDate={}; list.forEach(d=>(byDate[d.date]=byDate[d.date]||[]).push(d));
  Object.values(byDate).forEach(a=>a.sort(starFirst));
  const busy=new Set();
  for(let i=0;i<weeks*7;i++){ const dt=new Date(start); dt.setDate(start.getDate()+i); if(byDate[keyOf(dt)]||topicsOn(keyOf(dt)).length||evOn(keyOf(dt))) busy.add(dt.getDay()); }
  const todayDow=new Date(TODAY+'T00:00').getDay();
  const todayInView=TODAY>=keyOf(start) && TODAY<=keyOf(new Date(start.getFullYear(),start.getMonth(),start.getDate()+weeks*7-1));
  const slim=w=>busy.size>0 && !busy.has(w);
  const calEl=document.getElementById('cal');
  calEl.style.gridTemplateColumns=[0,1,2,3,4,5,6].map(w=>slim(w)?'46px':'minmax(0,1fr)').join(' ');
  let h=DOW.map((w,i)=>`<div class="dow ${i==0?'sun':i==6?'sat':''}${slim(i)?' slim':''}${todayInView&&i===todayDow?' now':''}" style="--r:1">${w}</div>`).join('');
  // hub: each topic as bars over its days, cut per week, at most MAX_LANES lanes a week (the rest counted per day)
  const lanes={}, hidden={};
  for(let wk=0;wk<weeks;wk++){
    const ws=addDay(keyOf(start),wk*7), we=addDay(ws,6);
    const segs=TOPICS.filter(x=>x.first<=we&&x.last>=ws).sort((a,b)=>a.first.localeCompare(b.first)||b.last.localeCompare(a.last))
      .map(x=>({x, s:x.first>ws?x.first:ws, e:x.last<we?x.last:we}));
    const end=[];
    segs.forEach(sg=>{
      let l=end.findIndex(e=>e<sg.s); if(l<0){ l=end.length; end.push(''); }
      end[l]=sg.e; sg.lane=l;
      if(l>=MAX_LANES) for(let k=sg.s;k<=sg.e;k=addDay(k,1)) hidden[k]=(hidden[k]||0)+1;
    });
    lanes[wk]=Math.min(end.length,MAX_LANES);
    segs.filter(sg=>sg.lane<MAX_LANES).forEach(sg=>{
      const x=sg.x, t=versionOn(x,sg.s).t, c0=dnum(sg.s)-dnum(ws)+1, c1=dnum(sg.e)-dnum(ws)+2;
      h+=`<a class="tbar${x.first<ws?' cl':''}${x.last>we?' cr':''}" data-topic="${esc(x.id)}" data-s="${sg.s}" data-e="${sg.e}" href="${VT_PAGE}#t=${encodeURIComponent(x.id)}" style="${hubVars};--r:${wk+2};--l:${sg.lane};grid-row:${wk+2};grid-column:${c0}/${c1}" aria-label="${esc(`話題：${t.title}（${ATT[t.attitude]||''}・${fmtDate(x.first,false)}〜${fmtDate(x.last,false)}）`)}"><b aria-hidden="true">${ATT_M[t.attitude]||'・'}</b><span class="tt">${esc(t.title)}</span></a>`;
    });
  }
  for(let i=0;i<weeks*7;i++){
    const dt=new Date(start); dt.setDate(start.getDate()+i);
    const key=keyOf(dt), w=dt.getDay(), items=byDate[key]||[];
    const cls=['day']; if(dt.getMonth()!==m-1) cls.push('out'); if(key===TODAY) cls.push('today'); else if(key<TODAY) cls.push('past');
    if(slim(w)) cls.push('slim'); if(w===6) cls.push('lastcol');
    const badge=key===TODAY?`<span class="tbadge">TODAY</span>`:'';
    const wk=Math.floor(i/7), pos=`style="--r:${wk+2};grid-column:${w+1}"`;
    const n=HUB?`<button class="n" data-open-day="${key}" aria-label="${dayLabel(key,items.length,topicsOn(key).length,evOn(key)?.n)}">${dt.getDate()}</button>`:`<span class="n">${dt.getDate()}</span>`;
    if(slim(w)){ h+=`<div class="${cls.join(' ')}" ${pos}><div class="dn ${w==0?'sun':w==6?'sat':''}">${n}${badge}</div></div>`; continue; }
    const tl=lanes[wk]?`<span class="tlanes" style="height:${lanes[wk]*26-4}px"></span>`:'';
    const tm=hidden[key]?`<button class="tmore" data-open-day="${key}" tabindex="-1">ほか${hidden[key]}件の話題</button>`:'';
    const shown=items.slice(0,PER_DAY);
    h+=`<div class="${cls.join(' ')}" ${pos}><div class="dn ${w==0?'sun':w==6?'sat':''}">${n}${badge}${items.length?`<span class="c">${items.length}件</span>`:''}</div>${tl}${tm}${shown.map(pkBtn).join('')}${items.length>PER_DAY?`<button class="more" data-day="${key}">+${items.length-PER_DAY}件をすべて表示</button>`:''}${evOn(key)?`<p class="evc" aria-hidden="true">${evShort(evOn(key)).map(p=>`<span>${esc(p[0])}&nbsp;<b>${p[1]}</b></span>`).join('')}</p>`:''}</div>`;
  }
  calEl.innerHTML=h;

  const inMonth=list.filter(d=>d.date.startsWith(state.month));
  renderTimeline();
  // hub: upcoming days with events are listed too (past ones stay out of the folded past list)
  const days=[...new Set([...inMonth.map(d=>d.date),...monthDays(state.month).filter(k=>evOn(k))])].sort();
  let ag='', lineDone=!TODAY.startsWith(state.month);
  const pastDays=days.filter(k=>k<TODAY);
  if(pastDays.length && !state.showPast && days.some(k=>k>=TODAY))
    ag+=`<button class="pastbtn" id="showPast">${EVH?'過去の日':'過去の発売日'}（${pastDays.length}日分）を表示</button>`;
  days.forEach(k=>{
    if(k<TODAY && !state.showPast && days.some(x=>x>=TODAY)) return;
    if(!lineDone && k>TODAY){ ag+=`<div class="todayline"><span>今日 ${fmtDate(TODAY,false)}</span></div>`; lineDone=true; }
    if(k===TODAY) lineDone=true;
    const its=inMonth.filter(d=>d.date===k).sort(starFirst);
    const [,,dd]=k.split('-').map(Number), w=new Date(k+'T00:00').getDay();
    ag+=`<section data-day="${k}" class="ag${k===TODAY?' today':k<TODAY?' past':''}"><h3>${HUB?`<button class="agn" data-open-day="${k}" aria-label="${dayLabel(k,its.length,topicsOn(k).length,evOn(k)?.n)}">${dd}</button>`:dd}<span class="dw ${w==0?'sun':w==6?'sat':''}">${DOW[w]}曜</span>${k===TODAY?'<span class="tbadge">TODAY</span>':''}${its.length?`<span class="ct">${its.length}件</span>`:''}${its.length>Math.max(DAY_PEEK,its.filter(isStar).length)&&state.openDays.has(k)?`<button class="daytoggle mini" data-day="${k}" aria-expanded="true">閉じる</button>`:''}</h3><div class="list">${dayList(k,its)}${evOn(k)?`<button class="evag" data-open-day="${k}">イベント ${evOn(k).n}件 ›</button>`:''}</div></section>`;
  });
  if(!lineDone) ag+=`<div class="todayline"><span>今日 ${fmtDate(TODAY,false)}</span></div>`;
  document.getElementById('agenda').innerHTML = days.length ? ag : `<div class="empty">この月に該当する発売予定はありません</div>`;
  if(EVH) loadEv(state.month);
}

function renderTable(list){
  const {k,dir}=state.sort;
  list=[...list].sort((a,b)=>{
    let x=a[k],y=b[k];
    if(x==null||x==='') return 1; if(y==null||y==='') return -1;
    const c = typeof x==='number' ? x-y : String(x).localeCompare(String(y),'ja');
    return (c||a.date.localeCompare(b.date))*dir;
  });
  document.querySelectorAll('thead th[data-k]').forEach(th=>th.setAttribute('aria-sort', th.dataset.k===k?(dir>0?'ascending':'descending'):'none'));
  const byDate = k==='date';
  let lineDone=!byDate, h='';
  const line=`<tr class="tl"><td colspan="8"><div><span>今日 ${fmtDate(TODAY)}</span></div></td></tr>`;
  list.forEach(d=>{
    if(!lineDone && (dir>0 ? d.date>=TODAY : d.date<TODAY)){ h+=line; lineDone=true; }
    h+=`<tr class="${d.date===TODAY?'istoday':d.date<TODAY?'past':''}${isStar(d)?' starred':''}">
    <td class="sc">${starBtn(d)}</td>
    <td class="d">${fmtDate(d.date)}</td>
    <td class="im"><button class="pk thbtn" style="--h:${HUE[d.game]}" data-id="${d.id}" aria-label="詳細">${thumb(d)}</button></td>
    <td class="gm"><span class="tag" style="--h:${HUE[d.game]}">${gi(d.game)}${esc(d.game)}</span></td>
    <td class="nm">${esc(d.name)}${d.approx?'<span class="ap" title="シリーズのキービジュアル等のため、実際のパッケージと異なる場合があります">参考画像</span>':''}</td>
    <td class="p p1">${esc(d.pack||'—')}</td>
    <td class="p bx">${esc(d.box||'—')}${d.box&&d.per_box?`<small class="pb">${d.per_box}パック</small>`:''}</td>
    <td class="lk">${[d.url?`<a href="${esc(d.url)}" target="_blank" rel="noopener">商品</a>`:'',OFFICIAL[d.game]?`<a href="${esc(OFFICIAL[d.game])}" target="_blank" rel="noopener">公式</a>`:''].filter(Boolean).join(' · ')}</td></tr>`;
  });
  if(!lineDone && list.length) h+=line;
  document.getElementById('tbody').innerHTML = list.length ? h : `<tr><td colspan="8" class="empty">該当する商品はありません</td></tr>`;
}
document.querySelector('thead').addEventListener('click',e=>{
  const th=e.target.closest('th[data-k]'); if(!th) return;
  state.sort = {k:th.dataset.k, dir: state.sort.k===th.dataset.k ? -state.sort.dir : 1};
  render();
});

function render(){
  renderChips();
  renderStarbar();
  const list=filtered();
  const isCal=state.view==='cal', scoped=monthScoped();
  document.getElementById('calView').hidden=!isCal;
  document.getElementById('tblView').hidden=isCal;
  document.getElementById('monthNav').hidden=!scoped;
  document.getElementById('vCal').setAttribute('aria-pressed',isCal);
  document.getElementById('vTbl').setAttribute('aria-pressed',!isCal);
  const [y,m]=state.month.split('-').map(Number);
  document.getElementById('monthLabel').innerHTML=`<small>${y}年</small>${m}月`;
  document.getElementById('sortSel').value=`${state.sort.k}:${state.sort.dir}`;
  document.getElementById('sortSel').hidden=isCal;
  const nf=HUB?0:state.sel.size, badge=document.getElementById('filterBadge');
  // a hub's calendar has nothing to filter (its title is the page); the phone sheet keeps the table's sort
  document.getElementById('filterBtn').hidden=!!HUB&&isCal;
  badge.hidden=!nf; badge.textContent=nf;
  document.getElementById('filterBtn').setAttribute('aria-label',nf?`絞り込み（${nf}タイトル選択中）`:'絞り込み');
  const sb=document.getElementById('starBtn'), sbb=document.getElementById('starBadge');
  sb.setAttribute('aria-pressed',state.starOnly); sb.querySelector('.ic').textContent=state.starOnly||stars.size?'★':'☆';
  sbb.hidden=!stars.size; sbb.textContent=stars.size;
  document.getElementById('prev').disabled=state.month<=months[0];
  document.getElementById('nextM').disabled=state.month>=months[months.length-1];
  const mnote=document.getElementById('mnote');
  mnote.hidden=!(isCal && pageHome && state.month===pageHome && state.sel.size===1 && state.sel.has(PAGE.game));
  if(!mnote.hidden) mnote.textContent = pageHome>curMonth ? `今月の発売はありません。次の発売月（${+pageHome.slice(5)}月）を表示しています` : '今月以降の発売はありません。最近の発売月を表示しています';
  // a month (from this one on) without upcoming releases for the filter points to the next release
  const nn=document.getElementById('nextnote');
  const nx=isCal && mnote.hidden && state.month>=curMonth && !list.some(d=>d.date>=TODAY&&d.date.startsWith(state.month))
    ? list.find(d=>d.date>=TODAY&&d.date.slice(0,7)>state.month) : null;
  nn.hidden=!nx;
  if(nx) nn.innerHTML=`${state.starOnly||state.sel.size&&!HUB?'この条件':'この月'}の発売予定はありません・<button class="nextbtn" data-next="${nx.date}">次の発売 ${fmtDate(nx.date,false)} へ ›</button>`;
  const inMonth=list.filter(d=>d.date.startsWith(state.month));
  if(HUB) history.replaceState(history.state,'',location.pathname+(state.month!==hubDefault?'?m='+state.month:'')+location.hash);
  if(isCal){ renderCal(list); document.getElementById('count').innerHTML=`この月 <b>${inMonth.length}</b> 件`; }
  else if(scoped){ renderTable(inMonth); document.getElementById('count').innerHTML=`この月 <b>${inMonth.length}</b> 件`; }
  else { renderTable(list); document.getElementById('count').innerHTML=`全期間 <b>${list.length}</b> 件`; }
}
document.getElementById('nextnote').addEventListener('click',e=>{
  const b=e.target.closest('[data-next]'); if(!b) return;
  const k=b.dataset.next; state.month=k.slice(0,7); render();
  requestAnimationFrame(()=>{
    const el=document.querySelector(`.ag[data-day="${k}"]`);
    (el&&el.offsetParent?el:document.getElementById('calView')).scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  });
});

document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="http"]'); if(!a) return;
  track('click_official',{link_url:a.href, link_text:a.textContent.trim().slice(0,60)});
});
function shiftMonth(n){
  let [y,m]=state.month.split('-').map(Number); m+=n; if(m<1){m=12;y--} if(m>12){m=1;y++}
  state.month=y+'-'+String(m).padStart(2,'0'); render();
}
function scrollToToday(){
  requestAnimationFrame(()=>{
    const el=document.querySelector(state.view==='cal'
      ? (getComputedStyle(document.getElementById('cal')).display==='none' ? '.ag.today, .todayline' : '.day.today')
      : 'tr.istoday, tr.tl');
    if(el) el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  });
}
document.getElementById('starBtn').onclick=()=>{
  if(!stars.size && !state.starOnly){ state.starOnly=true; } else state.starOnly=!state.starOnly;
  store.set('tcg.starOnly',state.starOnly); track('filter_favorites',{on:state.starOnly}); render(); window.scrollTo({top:0});
};
document.getElementById('filterBtn').onclick=e=>{
  const bar=document.querySelector('.bar'); const open=!bar.classList.contains('open');
  bar.classList.toggle('open',open); e.currentTarget.setAttribute('aria-expanded',open);
};
document.getElementById('sortSel').onchange=e=>{const [k,dir]=e.target.value.split(':'); state.sort={k,dir:+dir}; render();};
document.getElementById('agenda').addEventListener('click',e=>{
  if(e.target.closest('#showPast')){state.showPast=true;render();return}
  const t=e.target.closest('.daytoggle'); if(!t) return;
  const k=t.dataset.day; state.openDays.has(k)?state.openDays.delete(k):state.openDays.add(k);
  render();
  if(!state.openDays.has(k)) document.querySelector(`.ag[data-day="${k}"]`)?.scrollIntoView({block:'nearest'});
});
document.getElementById('prev').onclick=()=>shiftMonth(-1);

document.addEventListener('click',e=>{

const SITE_URL='https://shindan-navi.app/';
const ymd = s => s.replace(/-/g,'');
const nextDay = s => { const [y,m,d]=s.split('-').map(Number); return keyOf(new Date(y,m-1,d+1)); };
const eventTitle = d => `【発売日】${d.name}`;
const eventDetails = d => [
  `タイトル: ${d.game}`,
  d.pack ? `価格: ${d.pack}` : '',
  d.box ? `1BOX: ${d.box}${d.per_box?`（${d.per_box}パック入り）`:''}` : '',
  d.url ? `公式: ${d.url}` : (OFFICIAL[d.game] ? `公式: ${OFFICIAL[d.game]}` : ''),
  `トレカカレンダー: ${SITE_URL}`
].filter(Boolean).join('\n');
const googleCalUrl = d => 'https://calendar.google.com/calendar/render?' + new URLSearchParams({
  action:'TEMPLATE', text:eventTitle(d), dates:`${ymd(d.date)}/${ymd(nextDay(d.date))}`, details:eventDetails(d)
}).toString();
function icsEscape(t){ return String(t).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1'); }
function icsFold(line){
  const enc=new TextEncoder(); const out=[]; let cur='', bytes=0;
  for(const ch of line){
    const b=enc.encode(ch).length;
    if(bytes+b>(out.length?74:75)){ out.push(cur); cur=''; bytes=0; }
    cur+=ch; bytes+=b;
  }
  out.push(cur);
  return out.join('\r\n ');
}
function buildIcs(items){
  const now=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//shindan-navi.app//トレカカレンダー//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:トレカカレンダー'];
  items.forEach(d=>{
    L.push('BEGIN:VEVENT',`UID:${d.id}@shindan-navi.app`,`DTSTAMP:${now}`,
      `DTSTART;VALUE=DATE:${ymd(d.date)}`,`DTEND;VALUE=DATE:${ymd(nextDay(d.date))}`,
      `SUMMARY:${icsEscape(eventTitle(d))}`,`DESCRIPTION:${icsEscape(eventDetails(d))}`,
      `URL:${d.url||OFFICIAL[d.game]||SITE_URL}`,'TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEscape('明日発売: '+d.name)}`,'TRIGGER:-PT4H','END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n')+'\r\n';
}
function downloadIcs(items){
  const blob=new Blob([buildIcs(items)],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=items.length===1?`torecal-${ymd(items[0].date)}.ics`:'torecal-favorites.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

function copyStars(btn){
  const list=filtered().sort((a,b)=>a.date.localeCompare(b.date));
  const text=list.map(d=>`${fmtDate(d.date,false)} [${d.game}] ${d.name}${d.pack?' '+d.pack:''}${d.box?' / BOX '+d.box:''}`).join('\n');
  track('copy_favorites',{count:list.length});
  const done=ok=>{ btn.textContent=ok?'コピーしました':'コピーできませんでした'; setTimeout(()=>{ if(btn.isConnected) btn.textContent='一覧をコピー'; },2000); };
  try{ navigator.clipboard.writeText(text).then(()=>done(true),()=>fallback()); }catch(e){ fallback(); }
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    ta.remove(); done(ok);
  }
}

// ---- hub: 話題 from the voices API (the request /voices/ makes; docs/design/game-hub.md › 6). Releases never wait for

let TOPICS=[], VLATEST=null;
// a hub without a palette colour uses the release calendar's computed hue
const hubVars = !HUB ? '' : HUB.c ? `--gl:${HUB.c};--gd:${HUB.cd}` : `--gl:hsl(${HUE[PAGE.game]} 55% 42%);--gd:hsl(${HUE[PAGE.game]} 60% 68%)`;
const topicsOn = k => TOPICS.filter(t=>t.first<=k && k<=t.last);
const monthDays = ym => { const [y,m]=ym.split('-').map(Number); return Array.from({length:new Date(y,m,0).getDate()},(_,i)=>ym+'-'+String(i+1).padStart(2,'0')); };
const dnum = s => { const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d)/864e5; };
const dayLabel = (k,n,t,e) => { const [,m,d]=k.split('-').map(Number); return `${m}月${d}日(${DOW[new Date(k+'T00:00').getDay()]})`+(n?` 発売${n}件`:'')+(t?`・話題${t}件`:'')+(e?`・イベント${e}件`:''); };
// assembled, so builds without 話題 carry no link to the page, not even in this script
const VT_PAGE = '/'+'voices/';
const ATT_M = {positive:'＋', negative:'－', mixed:'±', neutral:'・'};
const MAX_LANES = 4;
const addDay = (k,n) => { const [y,m,d]=k.split('-').map(Number); return keyOf(new Date(y,m-1,d+n)); };
// phones: the month's topics, one row each with its days on a month track (the calendar grid is hidden there)
function renderTimeline(){
  const el=document.getElementById('tline'), ds=monthDays(state.month), a=ds[0], z=ds[ds.length-1];
  const xs=TOPICS.filter(x=>x.first<=z&&x.last>=a).sort((p,q)=>p.first.localeCompare(q.first));

    const t=versionOn(x,x.first<a?a:x.first).t, s=x.first<a?a:x.first, e=x.last>z?z:x.last;
    const l=(dnum(s)-dnum(a))/ds.length*100, w=(dnum(e)-dnum(s)+1)/ds.length*100;
    return `<a class="tlr" href="${VT_PAGE}#t=${encodeURIComponent(x.id)}" data-topic="${esc(x.id)}" aria-label="${esc(`話題：${t.title}（${ATT[t.attitude]||''}・${fmtDate(x.first,false)}〜${fmtDate(x.last,false)}）`)}"><span class="tt"><b aria-hidden="true">${ATT_M[t.attitude]||'・'}</b> ${esc(t.title)}</span><span class="td" aria-hidden="true">${fmtDate(x.first,false)}〜${fmtDate(x.last,false)}</span><span class="tk" aria-hidden="true"><i style="left:${l.toFixed(2)}%;width:${w.toFixed(2)}%"></i></span></a>`;
  }).join('');
}
const ATT = {positive:'好意的な声が多い', negative:'否定的な声が多い', mixed:'賛否が分かれている', neutral:'目立った賛否はない'};
let VSNAPS = 0;
// what a topic looked like on day k, as on /voices/: the first snapshot on or after k, else the latest
const versionOn = (x,k) => x.vs.find(v=>v.snap>=k) || x.vs[x.vs.length-1];
function topicBadge(v){
  if(v.t.status==='continuing') return `🔥 ${dnum(v.snap)-dnum(v.t.first_seen)+1}日連続`;
  if(v.t.status==='cooling') return '📉 落ち着き';
  return v.t.status==='new'&&VSNAPS>1 ? '🆕 新' : '';
}
const topicCard = v => { const b=topicBadge(v), t=v.t; return `<li class="tp"><a href="${VT_PAGE}#t=${encodeURIComponent(t.id)}">${esc(t.title)}</a>${b?`<span class="tb">${b}</span>`:''}<p>${esc(t.summary)}</p>${ATT[t.attitude]?`<small>${ATT[t.attitude]}</small>`:''}</li>`; };
// いま話題 cards (as on /): one link per card, 新 whenever the topic is new
const ATT_L = {positive:'好意的', negative:'否定的', mixed:'賛否両論', neutral:'中立'};
const nowBadge = v => v.t.status==='continuing' ? `<span class="badge hot"><span aria-hidden="true">🔥 </span>${dnum(v.snap)-dnum(v.t.first_seen)+1}日連続</span>`
  : v.t.status==='cooling' ? '<span class="badge cool"><span aria-hidden="true">📉 </span>落ち着き</span>'
  : v.t.status==='new' ? '<span class="badge new"><span aria-hidden="true">🆕 </span>新</span>' : '';
const nowCard = (v,i) => { const t=v.t, k=ATT[t.attitude]?t.attitude:'neutral';
  return `<li><a class="vt" href="${VT_PAGE}#t=${encodeURIComponent(t.id)}" aria-labelledby="htT${i}" aria-describedby="htM${i} htS${i}">`
    +`<span class="vh" id="htM${i}"><span class="am a-${k}"><span aria-hidden="true">${ATT_M[k]}</span>${ATT_L[k]}</span>${nowBadge(v)}</span>`
    +`<span class="tt" id="htT${i}">${esc(t.title)}</span><span class="sm" id="htS${i}">${esc(t.summary)}</span>`
    +`<span class="tr">反応の傾向（推定）：${ATT[k]}</span></a></li>`; };
function renderHubTopics(){
  const sec=document.getElementById('hubTopics'); if(!sec) return;
  // the snapshot dates are Tokyo days (as on /)
  if(!VLATEST || dnum(TODAY)-dnum(VLATEST)>7){ sec.hidden=true; return; }
  const now=TOPICS.filter(x=>x.last===VLATEST).map(x=>x.vs[x.vs.length-1]).sort((a,b)=>a.rank-b.rank);
  sec.setAttribute('style',hubVars);
  document.getElementById('hubTopicsBody').innerHTML=(now.length?`<ul class="vts">${now.slice(0,5).map(nowCard).join('')}</ul>`
      : `<p class="dl-none">最新のまとめ（${fmtDate(VLATEST,false)}）に${esc(HUB.short)}の話題はありません。</p>`)
    +`<p class="tp-f"><span>X（旧Twitter）の話題をAIが要約（${fmtDate(VLATEST,false)}時点）</span><a href="${VT_PAGE}">話題カレンダーで見る ›</a></p>`;
  sec.hidden=false;
}
async function loadTopics(){
  try{
    const r=await fetch(PAGE.voicesApi,{headers:{accept:'application/json'}}); if(!r.ok) return;
    const snaps=(await r.json()||{}).snapshots, day=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x);
    if(!Array.isArray(snaps) || !snaps.every(s=>s&&day(s.date)&&Array.isArray(s.topics)&&s.topics.every(t=>t&&typeof t.id==='string'&&typeof t.game==='string'
      &&typeof t.title==='string'&&typeof t.summary==='string'&&day(t.first_seen)))) return;
    const by=new Map();
    // a topic is active from first_seen to the last snapshot that lists it, shown as that snapshot has it
    [...snaps].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>s.topics.forEach((t,i)=>{
      if(t.game!==HUB.code) return;
      const x=by.get(t.id)||{id:t.id, first:t.first_seen, vs:[]};
      x.vs.push({snap:s.date, t, rank:i}); x.last=s.date;
      if(t.first_seen<x.first) x.first=t.first_seen;
      by.set(t.id,x);
    }));
    TOPICS=[...by.values()]; VSNAPS=snaps.length; VLATEST=snaps.reduce((m,s)=>s.date>m?s.date:m,'')||null;
  }catch(e){ return; }
  render(); renderHubTopics();
  if(dlg.open && dlgDay) openDay(dlgDay,true);
}
// render() replaces the day buttons: a dialog opened from one returns focus to that day's matching button (selector)
let dayOpener=null;
dlg.addEventListener('close',()=>{
  if(!dayOpener) return;
  const k=dayOpener; dayOpener=null;
  if(document.activeElement&&document.activeElement!==document.body) return;

});
// ---- hub: per-type event counts of this game in the player's location (M2, docs/design/game-hub.md › 6). One
// /events/days per shown month with the query /events/ sends for this one game, so both share cache keys. The location
// is the saved /events/ one, else the IP guess, saved only when the player picks. Any failure: no counts.
const EVH = HUB&&PAGE.eventsApi&&window.snLoc || null;
const EV_KEY = 'tcg.ev.filters';
const savedPref = () => { const s=store.get(EV_KEY,null); return (s&&typeof s.pref==='string'?s.pref.split(',').filter(EVH.isLoc)[0]:'')||''; };
let evPref=EVH?savedPref():'', evGuess=false;
const EVD={}; // `${pref}|${YYYY-MM}` -> 'loading' | 'error' | {date: {n, types}}
const evOn = k => { if(!EVH||!evPref) return null; const m=EVD[evPref+'|'+k.slice(0,7)]; return m&&typeof m==='object'&&m[k]||null; };
const evMonthLoaded = k => { const m=EVD[evPref+'|'+k.slice(0,7)]; return !!m&&typeof m==='object'; };
const nextYm = ym => addDay(ym+'-28',4).slice(0,7);
async function loadEv(ym){
  const key=evPref+'|'+ym; if(!evPref||EVD[key]) return;
  EVD[key]='loading';
  try{
    const r=await fetch(`${PAGE.eventsApi}/events/days?${new URLSearchParams({from:ym+'-01',until:nextYm(ym)+'-01',game:HUB.code,pref:evPref})}`,{headers:{accept:'application/json'}});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(), out={};
    if(!j||!Array.isArray(j.days)) throw new Error('shape');
    j.days.forEach(d=>{
      // by_game_type is newer than by_game: answers cached before it give a total only
      const cnt=v=>Number.isSafeInteger(v)&&v>=0, raw=d&&d.by_game_type&&d.by_game_type[HUB.code];
      const bt=raw&&typeof raw==='object'?Object.fromEntries(Object.entries(raw).filter(([c,v])=>/^[a-z0-9_]*$/.test(c)&&cnt(v))):null;
      const n=d&&d.by_game&&cnt(d.by_game[HUB.code])?d.by_game[HUB.code]:bt?Object.values(bt).reduce((a,b)=>a+b,0):0;
      if(d&&typeof d.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&n>0) out[d.date]={n, types:bt};
    });
    EVD[key]=out;
  }catch(e){ EVD[key]='error'; return; }
  if(key===evPref+'|'+state.month){ render(); if(dlg.open&&dlgDay) openDay(dlgDay,true); }
}
// [[name, n]] busiest first; types without a name (untyped, その他) go to ほか
function evSplit(x){
  const T=PAGE.types||{}, named=[]; let rest=0;
  Object.entries(x.types||{}).forEach(([c,n])=>{ if(T[c]&&c!=='other') named.push([T[c],n]); else rest+=n; });
  named.sort((a,b)=>b[1]-a[1]);
  return {named, rest: x.types?rest:x.n};
}
// a cell: up to 3 named types, else the top 2 + ほか N
function evShort(x){
  const {named,rest}=evSplit(x);
  if(!named.length) return [['イベント',x.n]];
  const top=named.length<=3&&!rest?named:named.slice(0,2), r=x.n-top.reduce((t,[,n])=>t+n,0);
  return r?[...top,['ほか',r]]:top;
}
const evDayLink = k => '/events/?'+new URLSearchParams({game:HUB.code,pref:evPref,range:'custom',from:k,to:k});
function evPart(k){
  if(!EVH||!evPref||!evMonthLoaded(k)) return '';
  const x=evOn(k), loc=esc(EVH.locName(evPref)+(evGuess?'（推定）':''));
  const {named,rest}=x?evSplit(x):{named:[],rest:0};
  return `<section class="dl-ev"><h3>イベント ${x?x.n:0}件（${loc}）</h3>${x?`<ul>${named.map(([l,n])=>`<li>${esc(l)} <b>${n}</b></li>`).join('')}${rest?`<li>ほか <b>${rest}</b></li>`:''}</ul>`:'<p class="dl-none">この日のイベントはありません。</p>'}<a href="${evDayLink(k)}">イベントカレンダーでこの日を見る ›</a></section>`;
}
// the location in effect changed: its line, the counts and an open day dialog follow
function locChanged(){ renderLoc(); render(); if(dlg.open&&dlgDay) openDay(dlgDay,true); }
function renderLoc(){
  const el=document.getElementById('locLine');
  if(!EVH){ el.hidden=true; return; }
  const name=evPref?EVH.locName(evPref)+(evGuess?'（推定）':''):'';
  el.innerHTML=evPref
    ? `<button type="button" class="locbtn" id="hubLoc" aria-haspopup="dialog" aria-label="イベントの地域: ${esc(name)}（変更）">📍${esc(name)}<small>変更</small></button><span>の${esc(HUB.short)}イベント数を日ごとに表示</span>`
    : `<button type="button" class="locbtn" id="hubLoc" aria-haspopup="dialog">📍地域を選ぶ</button><span>選ぶと日ごとのイベント数を表示します</span>`;
  el.hidden=false;
}
if(EVH){
  document.getElementById('locLine').addEventListener('click',e=>{
    if(!e.target.closest('#hubLoc')) return;
    EVH.open({current:()=>evGuess?'':evPref, onPick:c=>{
      const s=store.get(EV_KEY,null), o=s&&typeof s==='object'?{...s}:{};
      o.pref=c; store.set(EV_KEY,o); if(window.snPrefs) window.snPrefs.changed();
      evPref=c; evGuess=false; locChanged();
      document.getElementById('hubLoc').focus();
    }});
  });
  // the IP guess, asked once and only while nothing is saved
  let geo=null;
  const guess=()=>geo||(geo=fetch(`${PAGE.eventsApi}/geo`,{headers:{accept:'application/json'}}).then(r=>r.ok?r.json():null).then(j=>j&&EVH.PREF[j.region_code]?j.region_code:'',()=>''));
  // the location from the saved filters, else the guess; re-run when they change (account sync, another tab)
  async function syncLoc(){
    const p=savedPref();
    if(p){ if(p!==evPref||evGuess){ evPref=p; evGuess=false; locChanged(); } return; }
    if(evPref&&!evGuess){ evPref=''; locChanged(); }
    const g=await guess();
    if(!savedPref()&&g&&(g!==evPref||!evGuess)){ evPref=g; evGuess=true; locChanged(); }
  }
  document.addEventListener('sn:prefs',syncLoc);
  window.addEventListener('storage',e=>{ if(e.key===EV_KEY||e.key===null) syncLoc(); });
  renderLoc();
  syncLoc();
}
const swDlg=document.getElementById('swDlg');
if(HUB){
  const sw=document.getElementById('gameSw');
  sw.hidden=false;
  sw.innerHTML=`${gi(PAGE.game)}<span class="gn">${esc(HUB.chip)}</span><span class="cv" aria-hidden="true">▾</span>`;
  sw.setAttribute('aria-label',`タイトルを切り替え（表示中: ${HUB.short}）`);
  sw.onclick=()=>{
    const q='?m='+state.month;
    document.getElementById('swList').innerHTML=(PAGE.hubs||[]).map(h=>`<li><a href="/${h.slug}/${q}"${h.slug===HUB.slug?' aria-current="page"':''}>${gi(h.label)}${esc(h.short)}</a></li>`).join('');
    if(swDlg.showModal) swDlg.showModal(); else swDlg.setAttribute('open','');
  };
}
document.getElementById('swClose').onclick=()=>swDlg.close();
swDlg.addEventListener('click',e=>{if(e.target===swDlg)swDlg.close()});

// Deep links from the today page (/) and the product pages (/item/<id>/): #d=YYYY-MM-DD opens that day, #i=<id> one item. The hash is dropped after use.
const deep=/^#(d|i)=([\w-]+)$/.exec(location.hash);
const deepItems=deep?(deep[1]==='d'?DATA.filter(d=>d.date===deep[2]).sort(starFirst):DATA.filter(d=>d.id===deep[2])):[];
// a day without releases still opens its month (when the calendar has it) and says so
const deepDay=deep&&deep[1]==='d'&&/^\d{4}-\d{2}-\d{2}$/.test(deep[2])?deep[2]:null;
const deepMonth=deepItems.length?deepItems[0].date.slice(0,7):deepDay&&deepDay.slice(0,7);
if(deepMonth&&months.includes(deepMonth)) state.month=deepMonth;
render();
if(deep){
  history.replaceState(history.state,'',location.pathname+location.search);
  if(HUB&&deepDay) openDay(deepDay);
  else if(deepItems.length) openDetail(deepItems,fmtDate(deepItems[0].date)+(deepItems.length>1?` · ${deepItems.length}件`:''));
  else if(deepDay) openDetail([],fmtDate(deepDay));
}
if(HUB&&PAGE.voicesApi) loadTopics();
</script>

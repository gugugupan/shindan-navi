<!--
  /voices/<YYYY-MM-DD>/ 話題カレンダー archive: one indexable static page per real snapshot (contracts/voices.md), built by
  render_voices_day() in build.py, which fills SITE_CSS, VOICES_CSS (the card styles of src/voices.html), BRAND, CORNER,
  SITENAV and BODY (the snapshot's topics as cards, rendered in Python the way the /voices/ cards are). No page script.
-->
<style>/*SITE_CSS*/</style>
<style>/*PAGE_FONTS*/</style>
<style>/*VOICES_CSS*/</style>
<style>
.varc{display:grid;gap:12px;margin-top:10px;min-width:0}
.varc .ptitle h1{color:var(--ink);font-size:16px}
.varc .ptitle p{color:var(--muted)}
.vpn{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0;font-size:12.5px}
.vpn a{color:var(--accent);font-weight:700;text-decoration:none}
.vpn a:hover{text-decoration:underline}
.vpn-next{margin-left:auto}
.vtoc{display:flex;flex-wrap:wrap;gap:6px}
.vtoc a{text-decoration:none}
.vtoc .chip em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--muted)}
.vgsec{display:grid;gap:8px;min-width:0;scroll-margin-top:12px}
.vgsec h2{margin:6px 2px 0;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:400;font-size:18px;color:var(--gt,var(--ink))}
.vgsec h2 .gi{--gi:20px;margin:0}
.vgsec h2 small{font-family:var(--body);font-size:12px;font-weight:700;color:var(--muted)}
.vgsec .vcards{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
.tc{background:var(--surface);border:1px solid var(--line);scroll-margin-top:12px}
.tc .voices li{background:var(--surface-2)}
.tc-links a.vopen{margin-left:auto;color:var(--muted);font-size:11.5px}
.tc-links a.vopen:hover{color:var(--accent)}
@media (max-width:760px){.vgsec .vcards{grid-template-columns:minmax(0,1fr)}.vpn-cal{order:3;flex-basis:100%}}
</style>

<div class="wrap">
  <header class="top">
    <!--BRAND-->
    <!--CORNER-->
  </header>

  <!--BODY-->

  <div class="pageinfo">
    <p class="legend">話題は X（旧Twitter）で公開されている投稿をもとに AI が要約したものです。投稿の本文は掲載せず、要約・意見の言い換えと、もとの投稿へのリンクだけを載せています。反応の割合は集めた投稿のおおまかな傾向で、プレイヤー全体の意見を表すものではありません。公式の発表内容は各タイトルの公式サイト・公式アカウントでご確認ください。</p>
    <p class="legend">本サイトはアクセス解析のため Google アナリティクス（Cookie を使用し、閲覧ページ・参照元・端末やブラウザの情報などを Google に送信）を利用しています。詳しくは <a href="/privacy/">プライバシーポリシー</a> をご覧ください。</p>
  </div>
  <!--SITENAV-->
</div>
